# =============================================================================
# gitleaks — Secret-Scan-Konfiguration
#
# Erbt die Default-Rules und blendet kalibrierte False-Positives aus:
# - .env.example: nur konkret benannte Platzhalterzeilen, niemals der ganze Pfad
# - S3-Client-Aufrufe: gitleaks deutet den Variablennamen S3_ACCESS_KEY
#   selbst als Secret, der Inhalt kommt jedoch aus process.env
# - docs/operations/lizenz.md: gestumpfter Beispiel-JWT
# - totp.test.ts: feste Base32-Test-Vektoren (RFC-4648), keine echten TOTP-
#   Secrets. Pfad-Allowlist (statt Inline-Kommentar), weil der History-Scan
#   sonst den Treffer im Erst-Commit weiterhin meldet.
# =============================================================================

[extend]
useDefault = true

[[allowlists]]
description = "taxtronik-spezifische False-Positives"

paths = [
  '''(^|/)docs/operations/lizenz\.md$''',
  '''(^|/)apps/web/src/server/auth/__tests__/totp\.test\.ts$''',
]

# regexTarget = "line" prüft gegen die volle Quellzeile (Default wäre nur der
# extrahierte Secret-Wert — env.S3_SECRET_KEY allein hätte zu wenig Kontext,
# weil derselbe Bezeichner auch echte Treffer maskieren könnte).
regexTarget = "line"
regexes = [
  # Leere Secret-Platzhalter im ENV-Template. Die Pfad-Allowlist wurde bewusst
  # entfernt, damit ein versehentlich eingetragener echter Wert erkannt wird.
  '''^(AUTH_SECRET|SECRET_BOX_KEY|POSTGRES_PASSWORD|TAXTRONIK_APP_PASSWORD|S3_SECRET_KEY|N8N_HMAC_SECRET|N8N_ENCRYPTION_KEY|N8N_DB_PASSWORD)=$''',
  # S3-Client-Konstruktor: Variablen-Reference, kein hartkodiertes Secret.
  '''secretAccessKey:\s*env\.S3_SECRET_KEY''',
  # Synthetische Fixture-Werte aus scripts/tests/ops-lib.test.sh. Diese Werte
  # waren in Commit 6520d08 absichtlich nur Längen-Dummies für ./taxtronik doctor;
  # der History-Scan sieht sie weiterhin, obwohl keine echten Secrets vorliegen.
  '''N8N_ENCRYPTION_KEY=n8n-encryption-key-24chars''',
  '''S3_SECRET_KEY=s3-secret-with-at-least-thirty-two-chars''',
]

# gitleaks verbindet beim generic-api-key-Pattern im Erst-Commit die
# leere S3-Zeile mit dem Namen der direkt folgenden Bucket-Variable. Die
# Allowlist gilt nur für diese Regel, diesen Pfad UND genau die wertlose
# Zwei-Zeilen-Sequenz. Jeder nicht-leere S3_SECRET_KEY bleibt sichtbar.
[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "leerer S3-Platzhalter vor Bucket-Name"
condition = "AND"
regexTarget = "match"
paths = ['''(^|/)\.env\.example$''']
regexes = ['''^S3_SECRET_KEY=\r?\nS3_BUCKET_GOBD=''']

[[rules.allowlists]]
description = "quelltextgenaue Gitleaks-Gegenbeispiele im Regressionstest"
condition = "AND"
regexTarget = "line"
paths = ['''(^|/)scripts/tests/gitleaks-config\.test\.sh$''']
regexes = [
  '''S3_BUCKET_GOBD=gobd' > "\$REPO/\.env\.example"''',
  '''^\s*'S3_SECRET_KEY=Q7vN4mZ8pL2xR6cT9wK3dF5hJ1sB0yU4aE7qI6oP'\s*\\$''',
]

[[rules.allowlists]]
description = "quelltextgenauer synthetischer n8n-Key des Release-Image-Smokes"
condition = "AND"
regexTarget = "line"
paths = ['''(^|/)scripts/release/smoke-release-images\.sh$''']
regexes = ['''N8N_ENCRYPTION_KEY=smoke-n8n-encryption-key-32-chars''']
