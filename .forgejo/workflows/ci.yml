            rm -rf /tmp/pre-onboarding-041
            PGPASSWORD=taxtronik dropdb --if-exists -h localhost -U taxtronik "$ONBOARDING_DB" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          PGPASSWORD=taxtronik createdb -h localhost -U taxtronik "$ONBOARDING_DB"
          PGPASSWORD=taxtronik psql -h localhost -U taxtronik -d "$ONBOARDING_DB" \
            -v ON_ERROR_STOP=1 -f packages/db/prisma/init/01_bootstrap.sql

          mkdir -p "$TARGET"
          cp packages/db/prisma/migrations/migration_lock.toml "$TARGET/"
          for dir in packages/db/prisma/migrations/20*; do
            name="${dir##*/}"
            if [[ "$name" > "$CUTOFF" ]]; then
              continue
            fi
            cp -a "$dir" "$TARGET/"
          done
          cat > "$CONFIG" <<'EOF'
          import { defineConfig, env } from 'prisma/config';

          export default defineConfig({
            schema: 'prisma/schema.prisma',
            migrations: { path: '/tmp/pre-onboarding-041/packages/db/prisma/migrations' },
            datasource: { url: env('DATABASE_URL') },
