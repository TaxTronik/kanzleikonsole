  e2e-smoke:
    name: Browser E2E
    runs-on: ubuntu-latest
    needs: upgrade-path
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18@sha256:c27c01f74af25bde5f4f0f69d01944c4fc7f0376ea53c72aa1180dd593ce1d52
        env:
          POSTGRES_USER: taxtronik
          POSTGRES_PASSWORD: taxtronik
          POSTGRES_DB: taxtronik
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taxtronik"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine@sha256:b1addbe72465a718643cff9e60a58e6df1841e29d6d7d60c9a85d8d72f08d1a7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://taxtronik:taxtronik@localhost:5432/taxtronik?schema=public
      DATABASE_APP_URL: postgresql://taxtronik_app:taxtronik_app@localhost:5432/taxtronik?schema=public
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Rebuild approved native packages
        run: pnpm rebuild -r @prisma/client @prisma/engines esbuild prisma sharp unrs-resolver

      - name: Generate Prisma client
        run: pnpm --filter @taxtronik/db exec prisma generate

      - name: Install PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            if command -v sudo >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y postgresql-client
            else
              apt-get update
              apt-get install -y postgresql-client
            fi
          fi

      - name: Bootstrap database
        run: |
          PGPASSWORD=taxtronik psql -h localhost -U taxtronik -d taxtronik \
            -v ON_ERROR_STOP=1 -f packages/db/prisma/init/01_bootstrap.sql
          pnpm --filter @taxtronik/db exec prisma migrate deploy

      - name: Build web app
        run: pnpm --filter @taxtronik/web build

      - name: Install Playwright browser
        run: pnpm --filter @taxtronik/e2e exec playwright install chromium --with-deps

      - name: Start web app
        run: |
          pnpm --filter @taxtronik/web start > web.log 2>&1 &
          echo $! > web.pid

          for i in {1..60}; do
            status="$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/api/health || true)"
            if [ "$status" = "200" ] || [ "$status" = "503" ]; then
              exit 0
            fi
            sleep 2
          done

          cat web.log
          exit 1

      - name: Run E2E smoke tests
        run: pnpm --filter @taxtronik/e2e exec playwright test tests/01-smoke.spec.ts

      # immer hochladen (nicht nur bei Fehlschlag): der Report ist der
      # E2E-Testnachweis je Lauf (Testkonzept Abschnitt 4).
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: playwright-report
          retention-days: 90
          path: apps/e2e/playwright-report/
          if-no-files-found: ignore

  # ===========================================================================
  # E2E-Paranoid: härteter Teilsuite-Test (Rate-Limit, Walkthrough, Actions,
  # Compliance) — läuft nach dem vollen E2E-Smoke als zusätzlicher
  # Sicherheitsgurt im PR-Workflow. Trennung vom Smoke-Job, damit die gesamte
  # Compliance-+Security-Testsuite ihre eigenen Timeouts, Retries und Reports
  # bekommt, ohne den Smoke-Lauf zu verlangsamen.
  # ===========================================================================
  e2e-paranoid:
    name: E2E Paranoid (Rate-Limit, Actions, Compliance)
    runs-on: ubuntu-latest
    needs: e2e-smoke
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18@sha256:c27c01f74af25bde5f4f0f69d01944c4fc7f0376ea53c72aa1180dd593ce1d52
        env:
          POSTGRES_USER: taxtronik
          POSTGRES_PASSWORD: taxtronik
          POSTGRES_DB: taxtronik
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taxtronik"
          --health-interval 5s
