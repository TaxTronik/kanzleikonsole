name: Quality

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  # Fester Präfix statt github.workflow: in einem wiederverwendbaren Workflow
  # kann github.workflow den Namen des Callers tragen. Ohne eigenen Präfix
  # würden sich Quality und Security im Release-Lauf gegenseitig abbrechen.
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  DATABASE_URL: postgresql://taxtronik:taxtronik@localhost:5432/taxtronik?schema=public
  DATABASE_APP_URL: postgresql://taxtronik_app:taxtronik_app@localhost:5432/taxtronik?schema=public
  REDIS_URL: redis://localhost:6379
  AUTH_SECRET: ci-auth-secret-with-at-least-thirty-two-chars
  NEXTAUTH_URL: http://localhost:3000
  NEXTAUTH_TRUST_HOST: 'true'
  TRUST_PROXY_REQUIRED: 'false'
  S3_ENDPOINT: http://localhost:8333
  S3_REGION: us-east-1
  S3_ACCESS_KEY: ci
  S3_SECRET_KEY: ci-secret
  SMTP_HOST: localhost
  SMTP_PORT: '1025'
  SMTP_FROM: ci@example.test
  N8N_HMAC_SECRET: ci-hmac-secret-with-at-least-thirty-two-chars

jobs:
  quality:
    name: Format, Lint, Typecheck, Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # B-03: fester Ort des Turbo-Caches (ohne Wert legt Turbo ihn in einem
      # Git-Worktree beim Haupt-Checkout ab); Schritt "Turbo-Cache".
      TURBO_CACHE_DIR: .turbo/cache
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Guard pnpm supply-chain policy
        run: sh scripts/check-pnpm-supply-chain.sh

      # Wie der One-Click-Installer, die Images und alle anderen Jobs mit den
      # geprueften Install-Scripts (allowBuilds) installieren: --ignore-scripts
      # mit selektivem rebuild verdeckt neue Pakete ohne allowBuilds-
      # Entscheidung. Dieser frische Store erzwingt denselben
      # strictDepBuilds-Check auch nach einem zuvor erfolgreichen CI-Lauf.
      - name: Fresh install with reviewed dependency scripts
        run: pnpm install --frozen-lockfile --prod=false --store-dir "$(mktemp -d)"

      - name: Guard paranoid E2E coverage
        run: pnpm guard:paranoid-e2e

      - name: Format-Baseline prüfen
        run: pnpm format:check

      - name: Dokumentationslinks prüfen
        run: pnpm docs:check

      - name: Fachkatalog prüfen
        run: pnpm fachkatalog:check

      - name: Fachkatalog-Auswirkung prüfen
        env:
          FACHKATALOG_PR_BASE: ${{ github.event.pull_request.base.sha }}
          FACHKATALOG_PUSH_BASE: ${{ github.event.before }}
          FACHKATALOG_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: pnpm fachkatalog:diff

      - name: Generate Prisma client
        run: bash scripts/ci/setup.sh prisma

      - name: Guard real DATEV identifiers
        run: sh scripts/check-no-real-datev.sh

      - name: Guard ERiC/ELSTER spec artifacts
        run: sh scripts/check-no-eric-spec.sh

      - name: Guard no focused or skipped tests
        run: sh scripts/check-no-focused-tests.sh

      - name: Guard pinned CI service images
        run: sh scripts/check-ci-images-pinned.sh

      - name: Guard pinned Docker base images
        run: |
          node scripts/check-docker-bases-pinned.mjs
          node scripts/tests/check-docker-bases-pinned.test.mjs

      - name: Guard pinned CI actions
        run: sh scripts/check-ci-actions-pinned.sh

      # B-02: Jede PostgreSQL-Suite (*-db.test.ts) läuft im db-Job: Glob je
      # Paket mit DB_TESTS=1, ohne Opt-in scheitert sie in CI. Der Test listet
      # die gefundenen Dateien und ihren db-Schritt (scripts/ci/db-suites.mjs).
      - name: Guard DB-Suiten im db-Job
        run: node --test scripts/tests/db-suites-ci.test.mjs

      # B-07: keine Schein-Builds; typecheck/test hängen über transit an ihren
      # Abhängigkeiten, test nie aus dem Cache, externe Importe als Eingaben.
      - name: Guard Turbo-Pipeline
        run: node --test scripts/tests/turbo-pipeline.test.mjs

      # B-03: Cache-Pfade und -Schlüssel (Turbo, Next, Playwright-Browser).
      - name: Guard CI-Caches
        run: node --test scripts/tests/ci-caches.test.mjs

      - name: Guard migration line endings
        run: pnpm verify:migration-line-endings

      # D-01/D-07: Die Regeln des Migrations-Ledgers (bekannte Checksummen,
      # Reparaturzustaende, CRLF-Varianten) sind reine Node-Tests ohne
      # Datenbank; sie liefen bisher in keinem Job.
      - name: Migration ledger unit tests
        run: pnpm --filter @taxtronik/db test:migration-ledger

      # B-05: Shell-Skripte der Operator-CLI, der Guards und der Infra-Container
      # statisch pruefen. Projektoptionen stehen in .shellcheckrc, bewusste
      # Ausnahmen begruendet als Direktive an der Fundstelle.
      - name: shellcheck
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            SUDO=""
            if command -v sudo >/dev/null 2>&1; then SUDO=sudo; fi
            $SUDO apt-get update
            $SUDO apt-get install -y --no-install-recommends shellcheck
          fi
          shellcheck --version
          shellcheck taxtronik scripts/*.sh scripts/ops/*.sh infra/scripts/*.sh

      # S-04: Die Signaturtests des Source-Updates brauchen ssh-keygen
      # (openssh-client) und sind in CI Pflicht.
      - name: ssh-keygen installieren
        run: |
          if ! command -v ssh-keygen >/dev/null 2>&1; then
            SUDO=""
            if command -v sudo >/dev/null 2>&1; then SUDO=sudo; fi
            $SUDO apt-get update
            $SUDO apt-get install -y --no-install-recommends openssh-client
          fi
          ssh-keygen -V 2>/dev/null || command -v ssh-keygen

      - name: Operator CLI tests
        run: |
          set -o pipefail
          pnpm test:ops 2>&1 | tee testbericht-ops.log

      - name: Ops-Testnachweis hochladen
        if: always()
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1
        with:
          name: testbericht-ops
          retention-days: 90
          path: testbericht-ops.log
          if-no-files-found: ignore

      # R-10: Regressionstests der Windows-Hilfsskripte (scripts/tests/*.test.ps1,
      # docs/development/windows-hilfsskripte.md) mit PowerShell 7 unter Linux.
      # Release-Archiv mit gepinnter Version und SHA-256 wie gitleaks in
      # security.yml; Docker und pnpm sind in den Tests Attrappen. Fehlt ICU im
      # Runner-Image, läuft PowerShell im invarianten Globalisierungsmodus.
      - name: PowerShell installieren (Version + SHA-256 gepinnt)
        env:
          PWSH_VERSION: 7.6.6
          PWSH_LINUX_X64_SHA256: ddbc4a2d113bbd46d283cfedcbcd117a70caefd7673f41f2b4e0000badf103bc
        run: |
          set -euo pipefail
          pwsh_dir="$(mktemp -d)"
          curl -fsSL \
            "https://github.com/PowerShell/PowerShell/releases/download/v${PWSH_VERSION}/powershell-${PWSH_VERSION}-linux-x64.tar.gz" \
            -o "$pwsh_dir/pwsh.tar.gz"
          echo "${PWSH_LINUX_X64_SHA256}  $pwsh_dir/pwsh.tar.gz" | sha256sum -c -
          tar -xzf "$pwsh_dir/pwsh.tar.gz" -C "$pwsh_dir"
          rm "$pwsh_dir/pwsh.tar.gz"
          chmod +x "$pwsh_dir/pwsh"
          if ! ldconfig -p 2>/dev/null | grep -q 'libicuuc\.so'; then
            echo 'DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1' >> "$GITHUB_ENV"
            export DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1
          fi
          "$pwsh_dir/pwsh" -NoProfile -NonInteractive -Command '$PSVersionTable.PSVersion.ToString()'
          echo "PWSH=$pwsh_dir/pwsh" >> "$GITHUB_ENV"

      - name: PowerShell-Tests der Windows-Skripte
        run: |
          set -euo pipefail
          for test in scripts/tests/*.test.ps1; do
            echo "== $test"
            "$PWSH" -NoProfile -NonInteractive -File "$test"
          done

      # Ein ESLint-Lauf deckt Lint, React-Compiler-Regeln (error) und die
      # Komplexitaetsschuld ab (complexity: error + eslint-suppressions.json).
      - name: Lint
        run: pnpm lint

      # B-03: Turbo-Cache für `pnpm typecheck`; `test` spielt Turbo nie aus dem
      # Cache ab (turbo.json). Turbo prüft jeden Eintrag über den eigenen Task-
      # Hash (Paketdateien, Abhängigkeiten über transit, deklarierte externe
      # Eingaben, Lockfile-Auflösung, globalEnv); ein älterer Cache kann daher
      # kein veraltetes Ergebnis liefern. Der Schlüssel dient nur dem Auffinden:
      # je Commit gespeichert, wiederhergestellt vom jüngsten Stand desselben
      # Lockfiles, sonst von irgendeinem.
      - name: Turbo-Cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - name: Typecheck
        run: pnpm typecheck

      # ALLE Pakete außer @taxtronik/db (dessen RLS-Tests brauchen die echte
      # Postgres-Instanz → Job `db`). Vorher liefen hier nur 4 von 11 Test-
      # Paketen — Worker/Crypto/Risk-Layer & Co. waren in CI ungetestet.
      # Das Protokoll ist der Testnachweis je Lauf (docs/development/
      # testkonzept.md, Abschnitt 4) und wird als Artefakt archiviert.
      # turbo direkt aufrufen: `pnpm test -- --filter=…` würde den Filter an
      # vitest durchreichen statt an turbo (Paket-Scope bliebe ungefiltert).
      - name: Unit tests (alle Pakete ohne DB-Bedarf)
        run: |
          set -o pipefail
          pnpm exec turbo run test --filter='!@taxtronik/db' 2>&1 | tee testbericht-unit.log

      - name: Testnachweis hochladen
        if: always()
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1
        with:
          name: testbericht-unit
          retention-days: 90
          path: testbericht-unit.log
          if-no-files-found: ignore

  # Forgejo `act_runner` startet Services eines wiederverwendeten Workflows im
  # Host-Netz. Jeder Job mit PostgreSQL-Service nutzt deshalb einen eigenen
  # Port (PGPORT des Service = Host-Port = PGPORT/DATABASE_URL im Job-env),
  # Redis, MailHog und ClamAV nutzt nur e2e-paranoid. So laufen db, restore,
  # upgrade-path und e2e-paranoid parallel nach quality, ohne dass sich ihre
  # Services auf demselben Runner-Host ins Gehege kommen. Die Eindeutigkeit
  # der Host-Ports prueft scripts/release/check-release-gates.mjs.
  # Offen (B-03, Betriebsentscheidung): Zwei Laeufe desselben Jobs (z. B. zwei
  # Pull Requests oder Release-Aufruf neben einem Push) auf demselben Runner-
  # Host belegen dieselben Ports. Workflow-Ausdruecke koennen keinen Port je
  # Lauf berechnen; Abhilfe schaffen nur Runner-Kapazitaet 1 je Host, eine
  # Concurrency-Gruppe je Job oder dynamische Ports per docker run.
  db:
    name: Migrations, RLS, Drift
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18@sha256:c27c01f74af25bde5f4f0f69d01944c4fc7f0376ea53c72aa1180dd593ce1d52
        env:
          POSTGRES_USER: taxtronik
          POSTGRES_PASSWORD: taxtronik
          POSTGRES_DB: taxtronik
          # Eigener Port je Job: Server, Healthcheck und Host-Mapping nutzen
          # denselben Wert, auch wenn der Runner Services im Host-Netz startet.
          PGPORT: '15433'
        ports:
          - 15433:15433
        options: >-
          --health-cmd "pg_isready -U taxtronik"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '15433'
      PGUSER: taxtronik
      PGPASSWORD: taxtronik
      PGDATABASE: taxtronik
      DATABASE_URL: postgresql://taxtronik:taxtronik@localhost:15433/taxtronik?schema=public
      DATABASE_APP_URL: postgresql://taxtronik_app:taxtronik_app@localhost:15433/taxtronik?schema=public
      SHADOW_DATABASE_URL: postgresql://taxtronik:taxtronik@localhost:15433/taxtronik_shadow?schema=public
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Abhaengigkeiten (gepruefte Hooks), Prisma-Client, PostgreSQL-Client und
      # Rollen/Extensions der Job-DB: gemeinsames Setup aller DB-Jobs.
      - name: Setup (Abhängigkeiten, Prisma-Client, PostgreSQL-Client, Bootstrap)
        run: bash scripts/ci/setup.sh install prisma pg-client pg-bootstrap

      - name: Create shadow database
        run: |
          PGPASSWORD=taxtronik psql -h localhost -U taxtronik -d postgres \
            -v ON_ERROR_STOP=1 -c "CREATE DATABASE taxtronik_shadow"

      - name: Apply migrations
        run: pnpm db:migrate:deploy

      - name: Migration ledger checksum gate
        run: pnpm verify:migration-ledger

      # Dieselben versionierten SQL-Dateien (packages/db/invariants) prueft
      # scripts/ops-lib.sh nach jeder Kundenmigration, bevor schreibende Dienste
      # starten. Hier laufen sie gegen die echte, frisch migrierte DB:
      # Exit 1 = Invariante verletzt, Exit 2 = SQL-/Verbindungsfehler.
      - name: GwG-DB-Invarianten gegen die migrierte DB prüfen
        run: pnpm --filter @taxtronik/db verify:invariants

      # D-01: Funktionen, Trigger und RLS-Policies der frisch migrierten DB
      # muessen den kanonischen Quellen unter packages/db/prisma/sql entsprechen.
      # Abweichungen erscheinen als Diff im Log; Ablauf und Behebung stehen in
      # docs/development/kanonische-sql-quellen.md.
      - name: Kanonische SQL-Quellen gegen die migrierte DB prüfen
        run: pnpm db:sql:check

      - name: RLS tests
        run: |
          set -o pipefail
          pnpm --filter @taxtronik/db test 2>&1 | tee testbericht-db.log

      # B-02: Jede Datei *-db.test.ts(x) unter src/ ist eine PostgreSQL-Suite.
      # Die drei Schritte finden sie je Paket per Glob (`run test:db`,
      # vitest.db.config.ts) statt über eine Dateiliste; DB_TESTS=1 schaltet
      # alle ein, und mit CI=true scheitert eine Suite ohne Opt-in, statt still
      # übersprungen zu werden. Quelle: scripts/ci/db-suites.mjs, Prüfung:
      # scripts/tests/db-suites-ci.test.mjs (Quality-Job). Die Suiten eines
      # Pakets laufen nacheinander, jede in eigenem Prozess und eigenem Tenant.
      # Die Fachkatalog-Regeln, die eine Suite belegt, nennt ihr Dateikopf.
      # S-01: Web-, Worker- und Evidence-Suiten verbinden ihren Owner-Client
      # (DATABASE_URL) wie die Container als taxtronik_owner: BYPASSRLS ohne
      # Superuser, Rolle aus 01_bootstrap.sql, Grants aus der Migration
      # 20261006160000. Migrationen, Ledger-/Drift-/RLS-Gates und die
      # packages/db-Suite (Fixtures mit SET ROLE/DDL) behalten den Superuser.
      - name: Web-DB-Suiten gegen die PostgreSQL-App-Rolle (Glob)
        env:
          DB_TESTS: '1'
          DATABASE_URL: postgresql://taxtronik_owner:taxtronik_owner@localhost:15433/taxtronik?schema=public
        run: |
          set -o pipefail
          pnpm --filter @taxtronik/web run test:db 2>&1 | tee testbericht-web-db.log

      # AUDIT-VERIFY-ALERT-001 / AUDIT-RFC3161-ANCHOR-001: checkpointgestützte
      # Kettenprüfung (P-04) und Rolling-Anchor-Takt (P-05). Manipulations-
      # Fixtures schalten Schutz-Trigger ab (Tabellen-Owner); alle Fixtures
      # werden zurückgerollt.
      - name: Evidence-DB-Suiten gegen PostgreSQL (Glob)
        env:
          DB_TESTS: '1'
          DATABASE_URL: postgresql://taxtronik_owner:taxtronik_owner@localhost:15433/taxtronik?schema=public
          EVIDENCE_DB_ADMIN_URL: postgresql://taxtronik:taxtronik@localhost:15433/taxtronik?schema=public
        run: |
          set -o pipefail
          pnpm --filter @taxtronik/evidence run test:db 2>&1 | tee testbericht-evidence-db.log

      # Worker-Jobs gegen echtes PostgreSQL: nur externe Übergaben und der
      # Object Store sind Attrappen; eigene Tenants.
      - name: Worker-DB-Suiten gegen PostgreSQL (Glob)
        env:
          DB_TESTS: '1'
          DATABASE_URL: postgresql://taxtronik_owner:taxtronik_owner@localhost:15433/taxtronik?schema=public
        run: |
          set -o pipefail
          pnpm --filter @taxtronik/worker run test:db 2>&1 | tee testbericht-worker-db.log

      # S-01: der gemeinsame Mail-Versand (packages/mail) liest Vorlagen und
      # Empfänger über die App-Rolle; SMTP ist eine Attrappe, eigene Tenants.
      - name: Mail-DB-Suiten gegen PostgreSQL (Glob)
        env:
          DB_TESTS: '1'
          DATABASE_URL: postgresql://taxtronik_owner:taxtronik_owner@localhost:15433/taxtronik?schema=public
        run: |
          set -o pipefail
          pnpm --filter @taxtronik/mail run test:db 2>&1 | tee testbericht-mail-db.log

      # service-db.test.ts ist Nachweis für MANDATE-STRUCTURE-001,
      # GWG-BENEFICIAL-OWNERS-001, GWG-RISK-REVIEW-001 und
      # GWG-RETENTION-DESTRUCTION-001. Die Suite verlangt eine ausdrücklich
      # isolierte Datenbank (Name mit taxtronik_expansion_) und räumt sie nicht
      # selbst ab; der Schritt legt sie frisch an und entfernt sie danach.
      - name: Mandate services against an isolated PostgreSQL app role
        env:
          MANDATE_SERVICE_DB_TEST: '1'
          EXPANSION_DATABASE_URL: postgresql://taxtronik:taxtronik@localhost:15433/taxtronik_expansion_ci?schema=public
          EXPANSION_DATABASE_APP_URL: postgresql://taxtronik_app:taxtronik_app@localhost:15433/taxtronik_expansion_ci?schema=public
          EXPANSION_DATABASE_OWNER_URL: postgresql://taxtronik_owner:taxtronik_owner@localhost:15433/taxtronik_expansion_ci?schema=public
        run: |
          set -euo pipefail

          cleanup_expansion_database() {
            PGPASSWORD=taxtronik psql -h localhost -U taxtronik -d postgres \
              -v ON_ERROR_STOP=1 \
              -c 'DROP DATABASE IF EXISTS taxtronik_expansion_ci WITH (FORCE)' \
              >/dev/null 2>&1 || true
          }
          trap cleanup_expansion_database EXIT

          cleanup_expansion_database
          PGPASSWORD=taxtronik psql -h localhost -U taxtronik -d postgres \
            -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE taxtronik_expansion_ci'
          PGPASSWORD=taxtronik psql -h localhost -U taxtronik -d taxtronik_expansion_ci \
            -v ON_ERROR_STOP=1 -f packages/db/prisma/init/01_bootstrap.sql

          export DATABASE_URL="$EXPANSION_DATABASE_URL"
          export DATABASE_APP_URL="$EXPANSION_DATABASE_APP_URL"
          pnpm --filter @taxtronik/db exec prisma migrate deploy
          # S-01: die Suite selbst verbindet wie die Container als taxtronik_owner.
          export DATABASE_URL="$EXPANSION_DATABASE_OWNER_URL"
          pnpm --filter @taxtronik/web exec vitest run src/server/mandate-expansion/__tests__/service-db.test.ts 2>&1 | tee testbericht-mandate-services.log

      - name: Testnachweis hochladen
        if: always()
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1
        with:
          name: testbericht-db
          retention-days: 90
          path: |
            testbericht-db.log
            testbericht-web-db.log
            testbericht-evidence-db.log
            testbericht-worker-db.log
            testbericht-mail-db.log
            testbericht-mandate-services.log
          if-no-files-found: ignore

      - name: Schema drift check
        # A reused shadow DB must also rebuild custom app-schema functions.
        run: |
          pnpm verify:schema-drift
          pnpm verify:schema-drift

      - name: RLS drift gate
        run: pnpm verify:rls

      # D-05: Fremdschlüssel ohne führenden Index (FK-Prüfung und Joins lesen
      # sonst die ganze Kindtabelle). Allowlist und Regel stehen in
      # packages/db/scripts/fk-index-coverage.ts.
      - name: FK index gate
        run: pnpm verify:fk-indexes

      - name: Evidence chain CLI
        run: pnpm verify:chain

      - name: Known pre-release ledger drift upgrade
        env:
          LEGACY_DB_NAME: taxtronik_known_legacy_drift
          LEGACY_DATABASE_URL: postgresql://taxtronik:taxtronik@localhost:15433/taxtronik_known_legacy_drift?schema=public
          LEGACY_DATABASE_APP_URL: postgresql://taxtronik_app:taxtronik_app@localhost:15433/taxtronik_known_legacy_drift?schema=public
        run: sh packages/db/scripts/tests/known-legacy-drift-upgrade.sh

      # Der Dev-Seed ist ein eigener Integrationspfad und wird von den DB-Tests
      # nicht ausgefuehrt. Eine separate Datenbank verhindert, dass Demo-Daten
      # die vorherigen RLS-/Drift-Gates beeinflussen. Der zweite Lauf beweist,
      # dass auch ein bereits befuellter Stand idempotent bleibt.
      - name: Dev seed smoke (fresh database, idempotent)
        env:
          ADMIN_PASSWORD: ci-db-seed-smoke-admin-pw
          SEED_DATABASE_URL: postgresql://taxtronik:taxtronik@localhost:15433/taxtronik_seed_smoke?schema=public
          SEED_DATABASE_APP_URL: postgresql://taxtronik_app:taxtronik_app@localhost:15433/taxtronik_seed_smoke?schema=public
        run: |
          set -euo pipefail

          cleanup_seed_database() {
            PGPASSWORD=taxtronik psql -h localhost -U taxtronik -d postgres \
              -v ON_ERROR_STOP=1 \
              -c 'DROP DATABASE IF EXISTS taxtronik_seed_smoke WITH (FORCE)' \
              >/dev/null 2>&1 || true
          }
          trap cleanup_seed_database EXIT

          cleanup_seed_database
          PGPASSWORD=taxtronik psql -h localhost -U taxtronik -d postgres \
            -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE taxtronik_seed_smoke'
          PGPASSWORD=taxtronik psql -h localhost -U taxtronik -d taxtronik_seed_smoke \
            -v ON_ERROR_STOP=1 -f packages/db/prisma/init/01_bootstrap.sql

          DATABASE_URL="$SEED_DATABASE_URL" DATABASE_APP_URL="$SEED_DATABASE_APP_URL" \
            pnpm --filter @taxtronik/db exec prisma migrate deploy

          for run_number in 1 2; do
            echo "Dev seed smoke run ${run_number}/2"
            DATABASE_URL="$SEED_DATABASE_URL" DATABASE_APP_URL="$SEED_DATABASE_APP_URL" \
              pnpm --filter @taxtronik/db seed
          done

  restore:
    name: Backup→Restore Roundtrip
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18@sha256:c27c01f74af25bde5f4f0f69d01944c4fc7f0376ea53c72aa1180dd593ce1d52
        env:
          POSTGRES_USER: taxtronik
          POSTGRES_PASSWORD: taxtronik
          POSTGRES_DB: taxtronik
          # Eigener Port je Job: Server, Healthcheck und Host-Mapping nutzen
          # denselben Wert, auch wenn der Runner Services im Host-Netz startet.
          PGPORT: '15434'
        ports:
          - 15434:15434
        options: >-
          --health-cmd "pg_isready -U taxtronik"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '15434'
      PGUSER: taxtronik
      PGPASSWORD: taxtronik
      PGDATABASE: taxtronik
      DATABASE_URL: postgresql://taxtronik:taxtronik@localhost:15434/taxtronik?schema=public
      DATABASE_APP_URL: postgresql://taxtronik_app:taxtronik_app@localhost:15434/taxtronik?schema=public
      # Seed fix-codiertes Admin-Passwort → vermeidet das Schreiben von
      # .admin-credentials.txt und den zufälligen Passwort-Output in CI.
      ADMIN_PASSWORD: ci-restore-selftest-admin-pw
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Dieser Job ist der EINZIGE mit pg_dump/pg_restore (via runner.ts/
      # restore.ts). Anders als psql bricht pg_dump hart ab, wenn der Server
      # neuer ist als der Client („aborting because of server version
      # mismatch") — die Distro-Pakete (postgresql-client) sind älter als der
      # Postgres-18-Service. PG_CLIENT_MAJOR=18 holt den Client aus dem PGDG-Repo.
      - name: Setup (Abhängigkeiten, Prisma-Client, PostgreSQL-18-Client, Bootstrap)
        env:
          PG_CLIENT_MAJOR: '18'
        run: bash scripts/ci/setup.sh install prisma pg-client pg-bootstrap

      - name: Apply migrations
        run: pnpm --filter @taxtronik/db exec prisma migrate deploy

      - name: Seed demo data
        run: pnpm --filter @taxtronik/db seed

      - name: Backup→Restore self-test
        run: |
          set -o pipefail
          bash scripts/restore-selftest.sh 2>&1 | tee testbericht-restore.log

      # S-01: Worker-Backup und Restore-Drill ohne Superuser auf PostgreSQL 18:
      # pg_dump als taxtronik_owner (BYPASSRLS + SELECT), Wegwerf-DB und
      # pg_restore als taxtronik_drill (CREATEDB + BYPASSRLS) mit den Flags des
      # Produktiv-Restores; nur die DEFAULT-ACL-Einträge der Migrationsrolle
      # entfallen (wie apps/worker/src/jobs/backup-drill.ts).
      - name: Worker backup and restore drill without superuser
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          drill_db=taxtronik_drill_ci
          cleanup() {
            PGPASSWORD=taxtronik_drill psql -h localhost -p 15434 -U taxtronik_drill -d postgres \
              -c "DROP DATABASE IF EXISTS $drill_db WITH (FORCE)" >/dev/null 2>&1 || true
            rm -rf "$work"
          }
          trap cleanup EXIT
          {
            PGPASSWORD=taxtronik_owner pg_dump --format=custom --no-owner --compress=6 \
              -h localhost -p 15434 -U taxtronik_owner -d taxtronik -f "$work/owner.dump"
            PGPASSWORD=taxtronik_drill psql -h localhost -p 15434 -U taxtronik_drill -d postgres \
              -v ON_ERROR_STOP=1 -c "CREATE DATABASE $drill_db"
            pg_restore --list "$work/owner.dump" > "$work/full.list"
            grep -Ev '^[0-9]+; [0-9]+ [0-9]+ DEFAULT ACL ' "$work/full.list" > "$work/drill.list"
            echo "TOC: $(grep -c '^[0-9]' "$work/full.list") Einträge, Drill: $(grep -c '^[0-9]' "$work/drill.list")"
            PGPASSWORD=taxtronik_drill pg_restore --use-list="$work/drill.list" \
              --clean --if-exists --no-owner --single-transaction --exit-on-error \
              -h localhost -p 15434 -U taxtronik_drill -d "$drill_db" "$work/owner.dump"
            for table in tenant audit_log client; do
              source_rows="$(psql -tA -c "SELECT count(*) FROM $table")"
              drill_rows="$(PGPASSWORD=taxtronik_drill psql -tA -h localhost -p 15434 \
                -U taxtronik_drill -d "$drill_db" -c "SELECT count(*) FROM $table")"
              test "$source_rows" = "$drill_rows"
              echo "$table: $source_rows Zeilen (Quelle = Drill)"
            done
            PGPASSWORD=taxtronik_drill psql -h localhost -p 15434 -U taxtronik_drill -d postgres \
              -v ON_ERROR_STOP=1 -c "DROP DATABASE $drill_db WITH (FORCE)"
          } 2>&1 | tee testbericht-restore-drill.log

      - name: Testnachweis hochladen
        if: always()
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1
        with:
          name: testbericht-restore
          retention-days: 90
          path: |
            testbericht-restore.log
            testbericht-restore-drill.log
          if-no-files-found: ignore

  # ===========================================================================
  # Upgrade-Pfad: simuliert das Kunden-Update. Eine DB wird auf den
  # Migrationsstand des LETZTEN Release-Tags gebracht, dann werden die
  # aktuellen Migrationen darauf angewendet — genau das passiert bei jedem
  # ./taxtronik update beim Kunden. Fängt nachträglich editierte
  # Migrations-Historie und Brüche im Migrations-Suffix, die der frische
  # Komplett-Durchlauf im db-Job nicht sieht. Solange kein v*-Tag existiert,
  # entfallen diese Release-Schritte.
  #
  # Unabhängig vom Tag laufen immer die Altbestandstests mit Cutoff
  # (scripts/ci/migration-cutoff.sh): Migrationen bis zum Cutoff, historische
  # Fixtures, restliche Migrationen, Asserts — jeweils in eigener Datenbank.
  # ===========================================================================
  upgrade-path:
    name: Upgrade-Pfad (letztes Release → HEAD)
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18@sha256:c27c01f74af25bde5f4f0f69d01944c4fc7f0376ea53c72aa1180dd593ce1d52
        env:
          POSTGRES_USER: taxtronik
          POSTGRES_PASSWORD: taxtronik
          POSTGRES_DB: taxtronik
          # Eigener Port je Job: Server, Healthcheck und Host-Mapping nutzen
          # denselben Wert, auch wenn der Runner Services im Host-Netz startet.
          PGPORT: '15435'
        ports:
          - 15435:15435
        options: >-
          --health-cmd "pg_isready -U taxtronik"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '15435'
      PGUSER: taxtronik
      PGPASSWORD: taxtronik
      PGDATABASE: taxtronik
      DATABASE_URL: postgresql://taxtronik:taxtronik@localhost:15435/taxtronik?schema=public
      DATABASE_APP_URL: postgresql://taxtronik_app:taxtronik_app@localhost:15435/taxtronik?schema=public
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Letztes Release-Tag ermitteln
        id: last
        run: |
          git fetch --tags --force 2>/dev/null || true
          # Im Release-workflow_call ist der neu gepushte Tag bereits sichtbar.
          # Er darf nicht als Ausgangspunkt gewählt werden, sonst würde der
          # vermeintliche Upgrade-Test nur HEAD → HEAD prüfen.
          CURRENT_TAG=""
          case "${GITHUB_REF:-}" in
            refs/tags/v*) CURRENT_TAG="${GITHUB_REF_NAME:-}" ;;
          esac
          TAG="$(git tag --list 'v*' --sort=-v:refname | grep -vx "$CURRENT_TAG" | head -1 || true)"
          if [ -z "$TAG" ]; then
            echo "Kein v*-Tag vorhanden — Release-Upgrade-Schritte werden übersprungen."
          else
            echo "Teste Upgrade-Pfad ab Release: $TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Unabhaengig vom Tag: die Cutoff-Tests brauchen Abhaengigkeiten (Ledger-
      # Pruefung) und den PostgreSQL-Client; der Prisma-Client dient den
      # tag-gebundenen Release-Schritten.
      - name: Setup (Abhängigkeiten, Prisma-Client, PostgreSQL-Client)
        run: bash scripts/ci/setup.sh install prisma pg-client

      # Fachkatalog: GWG-ACTIVATION-GATE-001 (Migration 034 beendet
      # unvollständige Alt-Checks fail-closed und legt einen Folge-Review an).
      - name: Altbestand vor GwG-Migration 034 (Cutoff-Test)
        run: |
          bash scripts/ci/migration-cutoff.sh 20260801003300_invoice_storno_unique \
            scripts/ci/migration-cutoff/gwg-034-fixtures.sql \
            scripts/ci/migration-cutoff/gwg-034-asserts.sql

      # Fachkatalog: GWG-SELF-ONBOARDING-001 (Backfill des Onboarding-
      # Abschlusses nur bei aktivem Kontakt und tatsächlich verifizierter Prüfung).
      - name: Altbestand vor Onboarding-Backfill 041 (Cutoff-Test)
        run: |
          bash scripts/ci/migration-cutoff.sh 20260801004000_poa_created_at_db_clock \
            scripts/ci/migration-cutoff/onboarding-041-fixtures.sql \
            scripts/ci/migration-cutoff/onboarding-041-asserts.sql

      - name: Bootstrap roles and extensions
        if: steps.last.outputs.tag != ''
        run: bash scripts/ci/setup.sh pg-bootstrap

      - name: Migrationsstand des letzten Releases herstellen
        if: steps.last.outputs.tag != ''
        run: |
          set -euo pipefail
          TAG="${{ steps.last.outputs.tag }}"
          mkdir -p /tmp/release
          git archive "$TAG" packages/db/prisma/migrations | tar -x -C /tmp/release
          # Prisma 7: die Datasource-URL lebt in der Config, nicht im Schema.
          # Temporäre Config zeigt auf die Release-Migrationen; das Schema
          # (HEAD) dient nur der Provider-Validierung — `migrate deploy`
          # liest keine Models.
          cat > packages/db/upgrade-path.config.ts <<'EOF'
          import { defineConfig, env } from 'prisma/config';

          export default defineConfig({
            schema: 'prisma/schema.prisma',
            migrations: { path: '/tmp/release/packages/db/prisma/migrations' },
            datasource: { url: env('DATABASE_URL') },
          });
          EOF
          pnpm --filter @taxtronik/db exec prisma migrate deploy --config upgrade-path.config.ts
          rm packages/db/upgrade-path.config.ts

      - name: Aktuelle Migrationen darauf anwenden (= Kunden-Update)
        if: steps.last.outputs.tag != ''
        run: pnpm --filter @taxtronik/db exec prisma migrate deploy

      # Genau diese Pruefung entscheidet beim Kunden-Update ueber den Writer-Start.
      - name: GwG-DB-Invarianten nach dem Kunden-Update prüfen
        if: steps.last.outputs.tag != ''
        run: pnpm --filter @taxtronik/db verify:invariants

      # D-01/D-07: Auch die per Kunden-Update angehobene DB muss die kanonischen
      # Funktionen, Trigger und RLS-Policies aus packages/db/prisma/sql tragen.
      # Eine nachtraeglich geaenderte, beim Kunden bereits angewandte Migration
      # faellt im frisch migrierten db-Job nicht auf, hier aber als Diff.
      - name: Kanonische SQL-Quellen nach dem Kunden-Update prüfen
        if: steps.last.outputs.tag != ''
        run: pnpm db:sql:check

      - name: Migrationsstatus muss sauber sein
        if: steps.last.outputs.tag != ''
        run: pnpm --filter @taxtronik/db exec prisma migrate status

      - name: RLS-Tests auf der upgegradeten DB
        if: steps.last.outputs.tag != ''
        run: pnpm --filter @taxtronik/db test

  # ===========================================================================
  # E2E-Paranoid: die vollständige Playwright-Suite (Smoke, Auth/RBAC,
  # Rate-Limit, Walkthrough, Actions, Compliance, Differential, Concurrency,
  # Upload-Fuzz, A11Y) gegen die gebaute App mit produktionsnaher Infrastruktur
  # (SeaweedFS mit Object-Lock, ClamAV, MailHog, Redis). Der frühere separate
  # Smoke-Job ist hier aufgegangen: tests/01-smoke.spec.ts läuft als Teil der
  # vollständigen Suite, ein zweites `next build` und eine zweite Spec-Liste
  # entfallen.
  # Geprüft wird das ausgelieferte Artefakt: Produktions-Build und derselbe
  # Standalone-Server wie im Web-Image (NODE_ENV=production), PostgreSQL und
  # Redis mit den digest-gepinnten Images aus infra/compose/docker-compose.yml.
  # ===========================================================================
  e2e-paranoid:
    name: E2E Paranoid (Rate-Limit, Actions, Compliance)
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 45
    services:
      postgres:
        # Wie in Produktion (Alpine/musl, gleiche Kollation) statt Debian.
        image: postgres:18-alpine@sha256:96d56f7f57c6aacd1fcb908bc83b345ec5f83231ee486dd66a1baadce274db88
        env:
          POSTGRES_USER: taxtronik
          POSTGRES_PASSWORD: taxtronik
          POSTGRES_DB: taxtronik
          # Eigener Port je Job: Server, Healthcheck und Host-Mapping nutzen
          # denselben Wert, auch wenn der Runner Services im Host-Netz startet.
          PGPORT: '15436'
        ports:
          - 15436:15436
        options: >-
          --health-cmd "pg_isready -U taxtronik"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # MailHog für Magic-Link-Tests
      mailhog:
        image: mailhog/mailhog:latest@sha256:8d76a3d4ffa32a3661311944007a415332c4bb855657f4f6c57996405c009bea
        ports:
          - 8025:8025
          - 1025:1025
      # ClamAV für EICAR-Test
      clamav:
        image: clamav/clamav:stable@sha256:d4000290254603e7ee45d4904425c7d98c015af727f402756198fe41a31e7777
        ports:
          - 3310:3310
        options: >-
          --health-interval 30s
          --health-timeout 10s
          --health-retries 15
    env:
      PGHOST: localhost
      PGPORT: '15436'
      PGUSER: taxtronik
      PGPASSWORD: taxtronik
      PGDATABASE: taxtronik
      DATABASE_URL: postgresql://taxtronik:taxtronik@localhost:15436/taxtronik?schema=public
      DATABASE_APP_URL: postgresql://taxtronik_app:taxtronik_app@localhost:15436/taxtronik?schema=public
      REDIS_URL: redis://localhost:6379
      ADMIN_PASSWORD: dev-password-123
      DEV_SKIP_TOTP: 'true'
      E2E_ALLOW_DEV_SKIP_TOTP_IN_PRODUCTION: 'true'
      E2E_BASE_URL: http://localhost:3000
      E2E_IDENTITY_FIXTURE_URL: http://127.0.0.1:4319
      E2E_MAILHOG_URL: http://127.0.0.1:8025
      CLAMAV_HOST: localhost
      CLAMAV_PORT: '3310'
      SMTP_HOST: localhost
      SMTP_PORT: '1025'
      SMTP_FROM: 'TaxTronik <noreply@example.de>'
      S3_ENDPOINT: http://localhost:8333
      S3_REGION: us-east-1
      # Ausdrückliche CI-Werte: das Prod-Gate des Servers (NODE_ENV=production)
      # lehnt die Dev-Defaults ci/ci-secret* ab (dev-default-secrets.json).
      S3_ACCESS_KEY: e2e-access-key
      S3_SECRET_KEY: e2e-s3-secret-with-more-than-32-chars
      S3_BUCKET_GOBD: gobd
      S3_BUCKET_GWG: gwg
      S3_BUCKET_GENERAL: general
      S3_BUCKET_STAFF_PRIVATE: staff-private
      S3_BUCKET_BACKUPS: backups
      NODE_ENV: test
      # B-03: fester Browser-Ort für Installation, Tests und Cache-Schritt
      # (ohne Wert hängt er von HOME/XDG_CACHE_HOME des Runners ab). Relativ:
      # Playwright löst ihn gegen das Arbeitsverzeichnis auf, bei
      # `pnpm --filter @taxtronik/e2e exec` also apps/e2e/.cache/ms-playwright,
      # innerhalb des Job-Workspace.
      PLAYWRIGHT_BROWSERS_PATH: .cache/ms-playwright
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup (Abhängigkeiten, Prisma-Client, PostgreSQL-Client, Bootstrap)
        run: bash scripts/ci/setup.sh install prisma pg-client pg-bootstrap

      - name: Apply migrations
        run: pnpm --filter @taxtronik/db exec prisma migrate deploy

      - name: Seed database
        run: pnpm --filter @taxtronik/db seed

      - name: Disable TOTP and unlock admin account
        run: |
          PGPASSWORD=taxtronik psql -h localhost -U taxtronik -d taxtronik -c \
            "UPDATE staff_user SET locked_until = NULL, failed_login_count = 0, totp_secret_enc = NULL, totp_enrolled_at = NULL WHERE email = 'admin@taxtronik.local';"

      - name: Start SeaweedFS (same S3 engine as production)
        run: |
          # S3-Config aus Template rendern (Zugang aus dem Job-env)
          cat > /tmp/seaweedfs-s3.json << S3JSON
          {
            "identities": [
              {
                "name": "taxtronik",
                "credentials": [
                  { "accessKey": "${S3_ACCESS_KEY}", "secretKey": "${S3_SECRET_KEY}" }
                ],
                "actions": ["Admin","Read","Write","List","Tagging",
                  "GetBucketAcl","PutBucketAcl","GetObjectAcl","PutObjectAcl",
                  "GetObjectRetention","PutObjectRetention","GetObjectLegalHold",
                  "PutObjectLegalHold","GetBucketObjectLockConfiguration",
                  "PutBucketObjectLockConfiguration","GetBucketVersioning","PutBucketVersioning"]
              }
            ]
          }
          S3JSON

          # Selbstheilung fuer persistente/self-hosted Runner: ein abgebrochener
          # Vorlauf kann den Container liegenlassen und der feste Name wuerde
          # sonst mit "container name already in use" fehlschlagen.
          docker rm -f seaweedfs-ci >/dev/null 2>&1 || true

          # KEIN Host-Bind-Mount fuer die S3-Config: act_runner/Forgejo fuehrt
          # den Job in einem eigenen Container aus und reicht `docker` an den
          # Host-Daemon weiter. `-v /tmp/seaweedfs-s3.json:...` wird daher auf
          # dem Daemon-Host aufgeloest, wo die Datei nicht existiert -> dockerd
          # legt sie als Verzeichnis an -> SeaweedFS fatal ("s3.json: is a
          # directory"), das S3-Gateway stirbt. Container also nur `create`n
          # (laeuft noch nicht), die Config via `docker cp` in die eigene
          # Container-Schicht schreiben (wandert als tar ueber den Engine-API,
          # liegt also am Client-FS, nicht am Daemon-Host) und erst dann
          # `start`en. Topologie-unabhaengig (DinD/Socket/act-runner).
          docker create --name seaweedfs-ci \
            -p 8333:8333 -p 9333:9333 \
            chrislusf/seaweedfs:4.41@sha256:43b768cd62b00d132439cda881b93fd1adebf1b315e996e794087743821d771d \
            server -dir=/data -master.volumeSizeLimitMB=2048 \
            -volume.max=0 -s3 -s3.config=/etc/seaweedfs/s3.json \
            -s3.port=8333 -master.port=9333 -filer
          docker cp /tmp/seaweedfs-s3.json seaweedfs-ci:/etc/seaweedfs/s3.json
          docker start seaweedfs-ci

          # Wait for SeaweedFS health
          for i in $(seq 1 60); do
            if curl -sf http://localhost:9333/cluster/healthz >/dev/null 2>&1; then
              echo "SeaweedFS ready"
              break
            fi
            sleep 2
          done
          # Hart failen, wenn SeaweedFS nach 120s nicht healthy ist
          if ! curl -sf http://localhost:9333/cluster/healthz >/dev/null 2>&1; then
            echo "SeaweedFS not healthy after 120s — logs:"
            docker logs seaweedfs-ci 2>&1 | tail -50
            exit 1
          fi
          # Master-Health reicht nicht: das S3-Gateway kann noch nicht bereit
          # sein. Port 8333 muss HTTP sprechen, bevor aws-cli initialisiert.
          for i in $(seq 1 60); do
            code="$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8333/ || true)"
            if [ "$code" != "000" ]; then
              echo "SeaweedFS S3 gateway ready (HTTP $code)"
              break
            fi
            sleep 2
          done
          code="$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8333/ || true)"
          if [ "$code" = "000" ]; then
            echo "SeaweedFS S3 gateway not reachable after 120s — logs:"
            docker logs seaweedfs-ci 2>&1 | tail -80
            exit 1
          fi

      - name: Create S3 buckets with Object-Lock (SeaweedFS, production-parity)
        run: |
          # Buckets mit Object-Lock: COMPLIANCE für GoBD, GOVERNANCE für GwG.
          # Kein || true — wenn Object-Lock fehlschlägt, ist die Retention nicht belastbar.
          WORKSPACE_DIR="${GITHUB_WORKSPACE:-$PWD}"
          INIT_STORAGE="$WORKSPACE_DIR/infra/scripts/init-storage.sh"
          if [ ! -f "$INIT_STORAGE" ]; then
            echo "::error::Storage-Init-Skript fehlt oder ist kein File: $INIT_STORAGE"
            ls -la "$WORKSPACE_DIR/infra/scripts" || true
            exit 1
          fi
          docker run --rm -i --network host \
            -e AWS_ACCESS_KEY_ID="$S3_ACCESS_KEY" \
            -e AWS_SECRET_ACCESS_KEY="$S3_SECRET_KEY" \
            -e AWS_DEFAULT_REGION=us-east-1 \
            -e S3_ENDPOINT=http://localhost:8333 \
            --entrypoint /bin/sh \
            amazon/aws-cli:latest@sha256:c95ab0642137f55a12b95b6956dd03cefdbd73e760e0e7b870afc9b47f9c8150 -s < "$INIT_STORAGE"

      - name: Verify S3 buckets and Object-Lock
        run: |
          docker run --rm --network host \
            -e AWS_ACCESS_KEY_ID="$S3_ACCESS_KEY" \
            -e AWS_SECRET_ACCESS_KEY="$S3_SECRET_KEY" \
            -e AWS_DEFAULT_REGION=us-east-1 \
            --entrypoint /bin/sh \
            amazon/aws-cli:latest@sha256:c95ab0642137f55a12b95b6956dd03cefdbd73e760e0e7b870afc9b47f9c8150 -ec '
              AWS="aws --endpoint-url http://localhost:8333"
              assert_lock() {
                bucket="$1"
                expected_mode="$2"
                expected_years="$3"
                lock_config="$($AWS s3api get-object-lock-configuration \
                  --bucket "$bucket" \
                  --query "ObjectLockConfiguration.Rule.DefaultRetention.[Mode,Years]" \
                  --output text)"
                set -- $lock_config
                actual_mode="${1:-FEHLT}"
                actual_years="${2:-FEHLT}"
                if [ "$actual_mode" != "$expected_mode" ] || [ "$actual_years" != "$expected_years" ]; then
                  echo "::error::Object-Lock für Bucket $bucket falsch: erwartet ${expected_mode}/${expected_years} Jahre, erhalten ${actual_mode}/${actual_years}."
                  $AWS s3api get-object-lock-configuration --bucket "$bucket" || true
                  exit 1
                fi
                echo "Object-Lock $bucket: ${actual_mode}/${actual_years} Jahre"
              }

              for bucket in gobd gwg general staff-private backups; do
                $AWS s3api head-bucket --bucket "$bucket"
              done
              assert_lock gobd COMPLIANCE 10
              assert_lock gwg GOVERNANCE 5
            '

      # B-03: Dateisystem-Cache von Turbopack aus dem Produktions-Build (lokal
      # gemessen rund 480 MB). Turbopack prüft wiederhergestellte Einträge
      # selbst; der Schlüssel hängt am Lockfile (Next, Turbopack, Abhängigkeiten)
      # und an next.config.mjs, ein älterer Stand dient als Startpunkt.
      - name: Next-Build-Cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: apps/web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/web/next.config.mjs') }}
          restore-keys: |
            nextjs-${{ runner.os }}-

      # Wie Dockerfile.web als Produktions-Build: NODE_ENV=production bindet
      # HSTS und das Prod-Gate in das Artefakt; NEXTAUTH_URL muss dort https sein.
      # B-07: Der Job quality desselben Commits (needs) hat mit `pnpm typecheck`
      # dasselbe TypeScript-Programm geprüft (Web: next typegen + tsc); der Build
      # prüft die Typen deshalb nicht ein zweites Mal (next.config.mjs).
      - name: Build web app (Produktion)
        env:
          NODE_ENV: production
          NEXTAUTH_URL: https://localhost:3000
          TAXTRONIK_SKIP_BUILD_TYPECHECK: '1'
        run: pnpm --filter @taxtronik/web build

      # B-03: Browser-Binaries je Revision. browsers.json des installierten
      # playwright-core legt Revision und Verzeichnis fest (chromium-<rev>,
      # chromium_headless_shell-<rev>, ffmpeg-<rev>); Systempakete installiert
      # der nächste Schritt weiterhin (--with-deps, nicht cachebar).
      - name: Playwright-Browser-Cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: apps/e2e/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('node_modules/playwright-core/browsers.json') }}

      - name: Install Playwright browser
        run: pnpm --filter @taxtronik/e2e exec playwright install chromium --with-deps

      # Ausgeliefertes Artefakt statt `next start`: Standalone-Server mit der
      # Verzeichnisstruktur des Web-Images (static/public wie dessen COPYs),
      # NODE_ENV=production und HOSTNAME=0.0.0.0 wie im Container. Nur für
      # lokales HTTP ohne TLS-Proxy: NEXTAUTH_URL zeigt per https auf localhost
      # (Prod-Gate), E2E_BASE_URL bleibt http; erst CI=true, DEV_SKIP_TOTP und
      # E2E_ALLOW_DEV_SKIP_TOTP_IN_PRODUCTION erlauben dann unpräfixierte
      # Session-Cookies und den TOTP-Bypass (server/auth/session-cookie.ts,
      # server/auth/staff-login.ts). TRUST_PROXY_REQUIRED=true wie hinter dem
      # mitgelieferten Proxy: Next setzt X-Forwarded-For, IP-Limits greifen.
      - name: Start web app (Standalone-Server, NODE_ENV=production)
        env:
          NODE_ENV: production
          # S-01: Owner-Client wie im Web-Container als taxtronik_owner (kein
          # Superuser); Seeds und psql-Fixtures nutzen weiter das Job-env.
          DATABASE_URL: postgresql://taxtronik_owner:taxtronik_owner@localhost:15436/taxtronik?schema=public
          CI: 'true'
          NEXTAUTH_URL: https://localhost:3000
          TRUST_PROXY_REQUIRED: 'true'
          HOSTNAME: 0.0.0.0
          PORT: '3000'
        run: |
          standalone=apps/web/.next/standalone
          cp -R apps/web/.next/static "$standalone/apps/web/.next/static"
          cp -R apps/web/public "$standalone/apps/web/public"
          node "$standalone/apps/web/server.js" > web.log 2>&1 &
          echo $! > web.pid

          for i in {1..60}; do
            status="$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/api/health || true)"
            if [ "$status" = "200" ] || [ "$status" = "503" ]; then
              exit 0
            fi
            sleep 2
          done

          cat web.log
          exit 1

      - name: Start synthetic identity fixture
        run: |
          node apps/web/scripts/identity-smoke-server.mjs > identity-fixture.log 2>&1 &
          echo $! > identity-fixture.pid

          for i in {1..60}; do
            if curl -sf "$E2E_IDENTITY_FIXTURE_URL" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done

          cat identity-fixture.log
          exit 1

      - name: Flush Redis rate-limit state
        run: |
          if command -v redis-cli >/dev/null 2>&1; then
            redis-cli -h localhost FLUSHDB
          fi

      - name: Run E2E paranoid tests
        # Playwright discovers every spec, including newly added and nested files
        # and the smoke spec; do not maintain a second file list here.
        run: pnpm --filter @taxtronik/e2e exec playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1
        with:
          name: playwright-report-paranoid
          retention-days: 90
          path: apps/e2e/playwright-report/
          if-no-files-found: ignore

      - name: Stop SeaweedFS
        if: always()
        run: |
          if [ -f identity-fixture.pid ]; then kill "$(cat identity-fixture.pid)" >/dev/null 2>&1 || true; fi
          docker rm -f seaweedfs-ci >/dev/null 2>&1 || true

  # ===========================================================================
  # E-Rechnung-Konformität: erzeugt Referenz-XRechnungen für Mischsätze,
  # Reverse Charge und Storno (dieselbe Quelle wie die Unit-Tests) und prüft sie
  # mit dem KoSIT-Validator
  # gegen die XRechnung-3.0-Szenarien — XML-Schema + Schematron inkl. der
  # deutschen BR-DE-Geschäftsregeln. Der Job schlägt fehl, sobald der Generator
  # nicht-konformes XML liefert; der Prüfbericht ist der Konformitätsnachweis
  # je Lauf. Validator + Szenarien sind per Version UND SHA-256 gepinnt.
  # ===========================================================================
  e-rechnung:
    name: XRechnung-Konformität (KoSIT)
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15
    env:
      VALIDATOR_URL: https://github.com/itplr-kosit/validator/releases/download/v1.6.2/validator-1.6.2-standalone.jar
      VALIDATOR_SHA256: 244978514ad48f67c7573acfffc8f4fd73d81feda6f276710033f9913579857e
      SCENARIOS_URL: https://github.com/itplr-kosit/validator-configuration-xrechnung/releases/download/v2026-01-31/xrechnung-3.0.2-validator-configuration-2026-01-31.zip
      SCENARIOS_SHA256: 6a5a5911a421b25fbc423f62f93f894df7b236f5d73ca4f84bb222a945082704
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: bash scripts/ci/setup.sh install

      - name: Java + unzip + curl installieren
        run: |
          if ! command -v java >/dev/null 2>&1 || ! command -v unzip >/dev/null 2>&1 || ! command -v curl >/dev/null 2>&1; then
            SUDO=""
            if command -v sudo >/dev/null 2>&1; then SUDO=sudo; fi
            $SUDO apt-get update
            $SUDO apt-get install -y default-jre-headless unzip curl ca-certificates
          fi
          java -version

      - name: KoSIT-Validator + XRechnung-Szenarien laden (Version + SHA-256 gepinnt)
        run: |
          set -o pipefail
          mkdir -p kosit/config
          curl -fsSL -o kosit/validator.jar "$VALIDATOR_URL"
          echo "$VALIDATOR_SHA256  kosit/validator.jar" | sha256sum -c -
          curl -fsSL -o kosit/scenarios.zip "$SCENARIOS_URL"
          echo "$SCENARIOS_SHA256  kosit/scenarios.zip" | sha256sum -c -
          unzip -q -o kosit/scenarios.zip -d kosit/config

      - name: Referenz-XRechnungen erzeugen (Mischsätze + Reverse-Charge + Storno)
        run: pnpm --filter @taxtronik/web exec tsx src/server/invoicing/cli/generate-sample.ts "$GITHUB_WORKSPACE/kosit/sample.xml" "$GITHUB_WORKSPACE/kosit/sample-rc.xml" "$GITHUB_WORKSPACE/kosit/sample-storno.xml"

      # Der Validator liefert Exit ≠ 0 sowohl bei inhaltlichem REJECT als auch
      # bei Umgebungs-/Konfigfehlern (z. B. Szenario-Datei fehlt) — beides soll
      # den Job rot machen, aber die Logs müssen den Fall unterscheidbar machen.
      # Geschrieben wird der Bericht nur bei tatsächlicher Prüfung; bricht der
      # Validator vorher ab (kein report/), ist das ein Umgebungsfehler.
      - name: KoSIT-Validierung (Schema + Schematron + BR-DE)
        run: |
          cd kosit
          set +e
          java -jar validator.jar -s config/scenarios.xml -r config -o report sample.xml sample-rc.xml sample-storno.xml
          rc=$?
          set -e
          # Auf einen NICHT-LEEREN Report-Ordner prüfen statt auf einen festen
          # Dateinamen — der Validator benennt den Bericht <input>-report.xml,
          # was sich mit der Version ändern könnte. Leerer/fehlender Ordner =
          # Umgebungs-/Konfigfehler (Validator lief nicht), nicht REJECT.
          if [ -z "$(ls -A report 2>/dev/null)" ]; then
            echo "::error::KoSIT-Validator hat keinen Bericht geschrieben (Exit $rc) — Umgebungs-/Konfigurationsfehler, NICHT inhaltlicher REJECT."
            exit 1
          fi
          if [ $rc -ne 0 ]; then
            echo "::error::XRechnung-Validierung fehlgeschlagen (REJECT) — siehe Artefakt kosit-pruefbericht."
            exit $rc
          fi
          echo "XRechnung-Validierung bestanden (ACCEPTABLE)."

      - name: Prüfbericht hochladen
        if: always()
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1
        with:
          name: kosit-pruefbericht
          retention-days: 90
          path: kosit/report/
          # error statt ignore: fehlt der Bericht, ist das ein echtes Problem
          # (Validator lief nicht) und soll sichtbar werden, nicht still passieren.
          if-no-files-found: warn

  # ===========================================================================
  # deploy-readiness — Prod-KONFIGURATION gegen die ECHTE Compose-Infra.
  #
  # Die übrigen Jobs testen gegen einzeln aufgesetzte CI-Service-Container mit
  # CI-Konfig; prod-spezifische Fehler (Buckets nicht angelegt / ohne Object-
  # Lock, clamd StreamMaxLength < Upload-Cap, fehlende ClamAV-Signaturen,
  # kaputter S3-Roundtrip) fielen daher erst beim Kunden auf — genau die Klasse,
  # die den GwG-Upload lahmlegte. Dieser Job fährt seaweedfs + clamav aus der
  # ECHTEN infra/compose/docker-compose.yml hoch (mit den realen Artefakten
  # init-storage.sh, clamd.conf, seaweedfs-s3.template.json) und lässt den
  # Deploy-Readiness-Check dagegen laufen — dieselbe Prüfung, die auch nach
  # jedem `./taxtronik deploy`/`update` läuft (ops-lib deploy_readiness).
  # Fängt Prod-Konfig-Regressionen VOR dem Deploy.
  # ===========================================================================
  deploy-readiness:
    name: Deploy-Readiness (Prod-Konfig)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Nur für die Compose-Interpolation der Basis-Datei (postgres/n8n werden
      # NICHT gestartet — Dummies genügen).
      POSTGRES_PASSWORD: ci-postgres-pw
      TAXTRONIK_APP_PASSWORD: ci-app-pw
      # Eigene Host-Ports: der Storage-Integrationsjob desselben Laufs bindet
      # 8333/9333 (docker run) und 3310 (Service-Container) auf demselben
      # Runner-Host — mit den Default-Ports kollidierte das je nach Job-Timing
      # („bind: address already in use"). Die Compose-Interpolation verlegt nur
      # die HOST-Seite; im Container-Netz bleibt alles auf den Prod-Ports.
      SEAWEED_S3_PORT: '18333'
      SEAWEED_MASTER_PORT: '19333'
      SEAWEED_FILER_PORT: '18888'
      CLAMAV_HOST_PORT: '13310'
      # Der Readiness-Check läuft auf dem Host und muss dieselben Ports treffen
      # (Job-env überschreibt den globalen S3_ENDPOINT-Block).
      S3_ENDPOINT: http://localhost:18333
      CLAMAV_PORT: '13310'
      # CI-Override backt clamd.conf/s3.json/init-storage.sh in kurzlebige Images
      # (der Runner-Daemon sieht das Job-Workspace nicht → Einzeldatei-Binds von
      # dort scheitern). Siehe Kopf von docker-compose.ci.yml.
      COMPOSE: docker compose -f infra/compose/docker-compose.yml -f infra/compose/docker-compose.ci.yml
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: bash scripts/ci/setup.sh install

      - name: Render SeaweedFS-S3-Config (wie im Deploy)
        run: |
          sed -e "s|__S3_ACCESS_KEY__|${S3_ACCESS_KEY}|" \
              -e "s|__S3_SECRET_KEY__|${S3_SECRET_KEY}|" \
              infra/scripts/seaweedfs-s3.template.json \
              > infra/scripts/seaweedfs-s3.generated.json
          chmod 644 infra/scripts/seaweedfs-s3.generated.json

      - name: Start real infra (SeaweedFS + ClamAV)
        run: |
          set -euo pipefail
          # Selbstheilung bei liegengebliebenem Vorlauf (feste Container-Namen).
          $COMPOSE down -v --remove-orphans >/dev/null 2>&1 || true
          # CI-Images mit eingebackenen Config-Artefakten bauen (Context wird zum
          # Daemon gestreamt — host-pfad-unabhängig). seaweedfs-init wird für den
          # nächsten Schritt vorgebaut, damit `run` nicht implizit bauen muss.
          $COMPOSE build seaweedfs clamav seaweedfs-init
          $COMPOSE up -d --wait seaweedfs clamav
          # Ein automatischer Neustart darf Fehler des frischen Entrypoints
          # nicht kaschieren (z. B. fehlende Rechte beim Anlegen von /run/clamav).
          clamav_id="$($COMPOSE ps -q clamav)"
          test -n "$clamav_id"
          clamav_restarts="$(docker inspect --format '{{.RestartCount}}' "$clamav_id")"
          if [ "$clamav_restarts" != 0 ]; then
            echo "ClamAV muss ohne automatischen Neustart starten (RestartCount=$clamav_restarts)." >&2
            exit 1
          fi

      - name: Create buckets with Object-Lock (real init-storage.sh)
        # Der ECHTE Bucket-Init: gobd mit COMPLIANCE, gwg mit GOVERNANCE
        # (kein || true — bricht der Object-Lock, ist die Retention nicht belastbar).
        run: $COMPOSE run --rm seaweedfs-init

      - name: Deploy-Readiness-Check (S3-Buckets/Object-Lock/ClamAV/Roundtrip)
        # Retry: frisches ClamAV lädt die Signaturen (EICAR) ggf. erst per
        # freshclam nach dem TCP-Up. Bis zu 4 Versuche à 20 s.
        run: |
          set -uo pipefail
          for attempt in 1 2 3 4; do
            if pnpm verify:deploy-readiness; then
              echo "Deploy-Readiness OK (Versuch $attempt)."
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              echo "Noch nicht bereit (Versuch $attempt/4) — 20 s warten (ClamAV-Signaturen?)."
              sleep 20
            fi
          done
          echo "Deploy-Readiness fehlgeschlagen." >&2
          exit 1

      - name: Diagnose bei Fehler
        if: failure()
        run: |
          docker compose version || true
          clamav_id="$($COMPOSE ps --all -q clamav || true)"
          if [ -n "$clamav_id" ]; then
            docker inspect --format 'RestartCount={{.RestartCount}} State={{json .State}} Healthcheck={{json .Config.Healthcheck}} CapAdd={{json .HostConfig.CapAdd}}' "$clamav_id" || true
          fi
          echo "=== clamav ==="; $COMPOSE logs clamav --tail 60 || true
          echo "=== seaweedfs ==="; $COMPOSE logs seaweedfs --tail 60 || true
          echo "=== seaweedfs-init ==="; $COMPOSE logs seaweedfs-init --tail 60 || true

      - name: Infra abräumen
        if: always()
        run: $COMPOSE down -v --remove-orphans || true
