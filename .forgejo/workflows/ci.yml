name: Quality

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  DATABASE_URL: postgresql://taxtronik:taxtronik@localhost:5432/taxtronik?schema=public
  DATABASE_APP_URL: postgresql://taxtronik_app:taxtronik_app@localhost:5432/taxtronik?schema=public
  REDIS_URL: redis://localhost:6379
  AUTH_SECRET: ci-auth-secret-with-at-least-thirty-two-chars
  NEXTAUTH_URL: http://localhost:3000
  NEXTAUTH_TRUST_HOST: 'false'
  TRUST_PROXY_REQUIRED: 'false'
  S3_ENDPOINT: http://localhost:8333
  S3_REGION: us-east-1
  S3_ACCESS_KEY: ci
  S3_SECRET_KEY: ci-secret
  SMTP_HOST: localhost
  SMTP_PORT: '1025'
  SMTP_FROM: ci@example.test
  N8N_HMAC_SECRET: ci-hmac-secret-with-at-least-thirty-two-chars

jobs:
  quality:
    name: Lint, Typecheck, Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Rebuild approved native packages
        run: pnpm rebuild -r @prisma/client @prisma/engines esbuild prisma sharp unrs-resolver || true

      - name: Generate Prisma client
        run: pnpm --filter @taxtronik/db exec prisma generate

      - name: Guard real DATEV identifiers
        run: sh scripts/check-no-real-datev.sh

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests without external services
        run: |
          pnpm --filter @taxtronik/config test
          pnpm --filter @taxtronik/evidence test
          pnpm --filter @taxtronik/tax test
          pnpm --filter @taxtronik/web test

  db:
    name: Migrations, RLS, Drift
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: taxtronik
          POSTGRES_PASSWORD: taxtronik
          POSTGRES_DB: taxtronik
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taxtronik"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://taxtronik:taxtronik@localhost:5432/taxtronik?schema=public
      DATABASE_APP_URL: postgresql://taxtronik_app:taxtronik_app@localhost:5432/taxtronik?schema=public
      SHADOW_DATABASE_URL: postgresql://taxtronik:taxtronik@localhost:5432/taxtronik_shadow?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Rebuild approved native packages
        run: pnpm rebuild -r @prisma/client @prisma/engines esbuild prisma sharp unrs-resolver || true

      - name: Generate Prisma client
        run: pnpm --filter @taxtronik/db exec prisma generate

      - name: Install PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            if command -v sudo >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y postgresql-client
            else
              apt-get update
              apt-get install -y postgresql-client
            fi
          fi

      - name: Create shadow database
        run: |
          PGPASSWORD=taxtronik psql -h localhost -U taxtronik -d postgres \
            -v ON_ERROR_STOP=1 -c "CREATE DATABASE taxtronik_shadow"

      - name: Bootstrap roles and extensions
        run: |
          PGPASSWORD=taxtronik psql -h localhost -U taxtronik -d taxtronik \
            -v ON_ERROR_STOP=1 -f packages/db/prisma/init/01_bootstrap.sql

      - name: Apply migrations
        run: pnpm --filter @taxtronik/db exec prisma migrate deploy

      - name: RLS tests
        run: pnpm --filter @taxtronik/db test

      - name: Schema drift check
        run: pnpm verify:schema-drift

      - name: Evidence chain CLI
        run: pnpm verify:chain

  restore:
    name: Backup→Restore Roundtrip
    runs-on: ubuntu-latest
    needs: db
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: taxtronik
          POSTGRES_PASSWORD: taxtronik
          POSTGRES_DB: taxtronik
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taxtronik"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://taxtronik:taxtronik@localhost:5432/taxtronik?schema=public
      DATABASE_APP_URL: postgresql://taxtronik_app:taxtronik_app@localhost:5432/taxtronik?schema=public
      # Seed fix-codiertes Admin-Passwort → vermeidet das Schreiben von
      # .admin-credentials.txt und den zufälligen Passwort-Output in CI.
      ADMIN_PASSWORD: ci-restore-selftest-admin-pw
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Rebuild approved native packages
        run: pnpm rebuild -r @prisma/client @prisma/engines esbuild prisma sharp unrs-resolver || true

      - name: Generate Prisma client
        run: pnpm --filter @taxtronik/db exec prisma generate

      - name: Install PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            if command -v sudo >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y postgresql-client
            else
              apt-get update
              apt-get install -y postgresql-client
            fi
          fi

      - name: Bootstrap roles and extensions
        run: |
          PGPASSWORD=taxtronik psql -h localhost -U taxtronik -d taxtronik \
            -v ON_ERROR_STOP=1 -f packages/db/prisma/init/01_bootstrap.sql

      - name: Apply migrations
        run: pnpm --filter @taxtronik/db exec prisma migrate deploy

      - name: Seed demo data
        run: pnpm --filter @taxtronik/db seed

      - name: Backup→Restore self-test
        run: sh scripts/restore-selftest.sh

  e2e-smoke:
    name: Browser Smoke
    runs-on: ubuntu-latest
    needs: db
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: taxtronik
          POSTGRES_PASSWORD: taxtronik
          POSTGRES_DB: taxtronik
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taxtronik"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://taxtronik:taxtronik@localhost:5432/taxtronik?schema=public
      DATABASE_APP_URL: postgresql://taxtronik_app:taxtronik_app@localhost:5432/taxtronik?schema=public
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Rebuild approved native packages
        run: pnpm rebuild -r @prisma/client @prisma/engines esbuild prisma sharp unrs-resolver || true

      - name: Generate Prisma client
        run: pnpm --filter @taxtronik/db exec prisma generate

      - name: Install PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            if command -v sudo >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y postgresql-client
            else
              apt-get update
              apt-get install -y postgresql-client
            fi
          fi

      - name: Bootstrap database
        run: |
          PGPASSWORD=taxtronik psql -h localhost -U taxtronik -d taxtronik \
            -v ON_ERROR_STOP=1 -f packages/db/prisma/init/01_bootstrap.sql
          pnpm --filter @taxtronik/db exec prisma migrate deploy

      - name: Build web app
        run: pnpm --filter @taxtronik/web build

      - name: Install Playwright browser
        run: pnpm --filter @taxtronik/e2e exec playwright install chromium --with-deps

      - name: Start web app
        run: |
          pnpm --filter @taxtronik/web start > web.log 2>&1 &
          echo $! > web.pid

          for i in {1..60}; do
            status="$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/api/health || true)"
            if [ "$status" = "200" ] || [ "$status" = "503" ]; then
              exit 0
            fi
            sleep 2
          done

          cat web.log
          exit 1

      - name: Run smoke E2E
        run: pnpm --filter @taxtronik/e2e exec playwright test tests/01-smoke.spec.ts

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          if-no-files-found: ignore
