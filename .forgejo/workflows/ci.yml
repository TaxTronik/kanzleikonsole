name: Quality

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  # Fester Präfix statt github.workflow: in einem wiederverwendbaren Workflow
  # kann github.workflow den Namen des Callers tragen. Ohne eigenen Präfix
  # würden sich Quality und Security im Release-Lauf gegenseitig abbrechen.
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  DATABASE_URL: postgresql://taxtronik:taxtronik@localhost:5432/taxtronik?schema=public
  DATABASE_APP_URL: postgresql://taxtronik_app:taxtronik_app@localhost:5432/taxtronik?schema=public
  REDIS_URL: redis://localhost:6379
  AUTH_SECRET: ci-auth-secret-with-at-least-thirty-two-chars
  NEXTAUTH_URL: http://localhost:3000
  NEXTAUTH_TRUST_HOST: 'true'
  TRUST_PROXY_REQUIRED: 'false'
  S3_ENDPOINT: http://localhost:8333
  S3_REGION: us-east-1
  S3_ACCESS_KEY: ci
  S3_SECRET_KEY: ci-secret
  SMTP_HOST: localhost
  SMTP_PORT: '1025'
  SMTP_FROM: ci@example.test
  N8N_HMAC_SECRET: ci-hmac-secret-with-at-least-thirty-two-chars

jobs:
  quality:
    name: Format, Lint, Typecheck, Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm

      - name: Guard pnpm supply-chain policy
        run: sh scripts/check-pnpm-supply-chain.sh

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Format-Baseline prüfen
        run: pnpm format:check

      - name: Dokumentationslinks prüfen
        run: pnpm docs:check

      - name: Fachkatalog prüfen
        run: pnpm fachkatalog:check

      - name: Fachkatalog-Auswirkung prüfen
        env:
          FACHKATALOG_PR_BASE: ${{ github.event.pull_request.base.sha }}
          FACHKATALOG_PUSH_BASE: ${{ github.event.before }}
          FACHKATALOG_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: pnpm fachkatalog:diff

      - name: Rebuild approved native packages
        run: pnpm rebuild -r @prisma/client @prisma/engines esbuild prisma sharp unrs-resolver

      - name: Generate Prisma client
        run: pnpm --filter @taxtronik/db exec prisma generate

      - name: Guard real DATEV identifiers
        run: sh scripts/check-no-real-datev.sh

      - name: Guard ERiC/ELSTER spec artifacts
        run: sh scripts/check-no-eric-spec.sh

      - name: Guard paranoid E2E coverage
        run: sh scripts/check-paranoid-e2e.sh

      - name: Guard no focused or skipped tests
        run: sh scripts/check-no-focused-tests.sh

      - name: Guard pinned CI service images
        run: sh scripts/check-ci-images-pinned.sh

      - name: Guard pinned Docker base images
        run: |
          node scripts/check-docker-bases-pinned.mjs
          node scripts/tests/check-docker-bases-pinned.test.mjs

      - name: Guard pinned CI actions
        run: sh scripts/check-ci-actions-pinned.sh

      - name: Guard migration line endings
        run: pnpm verify:migration-line-endings

      - name: Operator CLI tests
        run: |
          set -o pipefail
          pnpm test:ops 2>&1 | tee testbericht-ops.log

      - name: Ops-Testnachweis hochladen
        if: always()
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: testbericht-ops
          retention-days: 90
          path: testbericht-ops.log
          if-no-files-found: ignore

      - name: Lint
        run: pnpm lint

      - name: React compiler warning baseline
        run: pnpm lint:react-compiler-baseline

      - name: Complexity warning baseline
        run: pnpm lint:complexity-baseline

      - name: Typecheck
        run: pnpm typecheck

      # ALLE Pakete außer @taxtronik/db (dessen RLS-Tests brauchen die echte
      # Postgres-Instanz → Job `db`). Vorher liefen hier nur 4 von 11 Test-
      # Paketen — Worker/Crypto/Risk-Layer & Co. waren in CI ungetestet.
      # Das Protokoll ist der Testnachweis je Lauf (docs/development/
      # testkonzept.md, Abschnitt 4) und wird als Artefakt archiviert.
      # turbo direkt aufrufen: `pnpm test -- --filter=…` würde den Filter an
      # vitest durchreichen statt an turbo (Paket-Scope bliebe ungefiltert).
      - name: Unit tests (alle Pakete ohne DB-Bedarf)
        run: |
          set -o pipefail
          pnpm exec turbo run test --filter='!@taxtronik/db' 2>&1 | tee testbericht-unit.log

      - name: Testnachweis hochladen
        if: always()
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: testbericht-unit
          retention-days: 90
          path: testbericht-unit.log
          if-no-files-found: ignore

  # Forgejo `act_runner` startet Services eines wiederverwendeten Workflows im
  # Host-Netz. Deshalb muessen alle Jobs mit PostgreSQL/Redis/weiteren festen
  # Service-Ports eine Kette bilden; parallele Starts kollidieren sonst trotz
  # getrennter Job-Container auf demselben Runner-Host.
  db:
    name: Migrations, RLS, Drift
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18@sha256:c27c01f74af25bde5f4f0f69d01944c4fc7f0376ea53c72aa1180dd593ce1d52
        env:
          POSTGRES_USER: taxtronik
          POSTGRES_PASSWORD: taxtronik
          POSTGRES_DB: taxtronik
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taxtronik"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://taxtronik:taxtronik@localhost:5432/taxtronik?schema=public
      DATABASE_APP_URL: postgresql://taxtronik_app:taxtronik_app@localhost:5432/taxtronik?schema=public
      SHADOW_DATABASE_URL: postgresql://taxtronik:taxtronik@localhost:5432/taxtronik_shadow?schema=public
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Rebuild approved native packages
        run: pnpm rebuild -r @prisma/client @prisma/engines esbuild prisma sharp unrs-resolver

      - name: Generate Prisma client
        run: pnpm --filter @taxtronik/db exec prisma generate

      - name: Install PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1 || \
             ! command -v createdb >/dev/null 2>&1 || \
             ! command -v dropdb >/dev/null 2>&1; then
            if command -v sudo >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y postgresql-client
            else
              apt-get update
              apt-get install -y postgresql-client
            fi
          fi

      - name: Create shadow database
        run: |
          PGPASSWORD=taxtronik psql -h localhost -U taxtronik -d postgres \
            -v ON_ERROR_STOP=1 -c "CREATE DATABASE taxtronik_shadow"

      - name: Bootstrap roles and extensions
        run: |
          PGPASSWORD=taxtronik psql -h localhost -U taxtronik -d taxtronik \
            -v ON_ERROR_STOP=1 -f packages/db/prisma/init/01_bootstrap.sql

      - name: Apply migrations
        run: pnpm db:migrate:deploy

      - name: Migration ledger checksum gate
        run: pnpm verify:migration-ledger

      - name: RLS tests
        run: |
          set -o pipefail
          pnpm --filter @taxtronik/db test 2>&1 | tee testbericht-db.log

      - name: Ticket services against the PostgreSQL app role
        env:
          REMINDER_TICKETS_DB_TEST: '1'
        run: |
          set -o pipefail
          pnpm --filter @taxtronik/web exec vitest run src/server/reminders/__tests__/tickets-db.test.ts 2>&1 | tee testbericht-reminder-services.log

      - name: Testnachweis hochladen
        if: always()
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: testbericht-db
          retention-days: 90
          path: |
            testbericht-db.log
            testbericht-reminder-services.log
          if-no-files-found: ignore

      - name: Schema drift check
        run: pnpm verify:schema-drift

      - name: RLS drift gate
        run: pnpm verify:rls

      - name: Evidence chain CLI
        run: pnpm verify:chain

      - name: Known pre-release ledger drift upgrade
        env:
          LEGACY_DB_NAME: taxtronik_known_legacy_drift
          LEGACY_DATABASE_URL: postgresql://taxtronik:taxtronik@localhost:5432/taxtronik_known_legacy_drift?schema=public
          LEGACY_DATABASE_APP_URL: postgresql://taxtronik_app:taxtronik_app@localhost:5432/taxtronik_known_legacy_drift?schema=public
        run: sh packages/db/scripts/tests/known-legacy-drift-upgrade.sh

      # Der Dev-Seed ist ein eigener Integrationspfad und wird von den DB-Tests
      # nicht ausgefuehrt. Eine separate Datenbank verhindert, dass Demo-Daten
      # die vorherigen RLS-/Drift-Gates beeinflussen. Der zweite Lauf beweist,
      # dass auch ein bereits befuellter Stand idempotent bleibt.
      - name: Dev seed smoke (fresh database, idempotent)
        env:
          ADMIN_PASSWORD: ci-db-seed-smoke-admin-pw
          SEED_DATABASE_URL: postgresql://taxtronik:taxtronik@localhost:5432/taxtronik_seed_smoke?schema=public
          SEED_DATABASE_APP_URL: postgresql://taxtronik_app:taxtronik_app@localhost:5432/taxtronik_seed_smoke?schema=public
        run: |
          set -euo pipefail

          cleanup_seed_database() {
            PGPASSWORD=taxtronik psql -h localhost -U taxtronik -d postgres \
              -v ON_ERROR_STOP=1 \
              -c 'DROP DATABASE IF EXISTS taxtronik_seed_smoke WITH (FORCE)' \
              >/dev/null 2>&1 || true
          }
          trap cleanup_seed_database EXIT

          cleanup_seed_database
          PGPASSWORD=taxtronik psql -h localhost -U taxtronik -d postgres \
            -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE taxtronik_seed_smoke'
          PGPASSWORD=taxtronik psql -h localhost -U taxtronik -d taxtronik_seed_smoke \
            -v ON_ERROR_STOP=1 -f packages/db/prisma/init/01_bootstrap.sql

          DATABASE_URL="$SEED_DATABASE_URL" DATABASE_APP_URL="$SEED_DATABASE_APP_URL" \
            pnpm --filter @taxtronik/db exec prisma migrate deploy

          for run_number in 1 2; do
            echo "Dev seed smoke run ${run_number}/2"
            DATABASE_URL="$SEED_DATABASE_URL" DATABASE_APP_URL="$SEED_DATABASE_APP_URL" \
              pnpm --filter @taxtronik/db seed
          done

  restore:
    name: Backup→Restore Roundtrip
    runs-on: ubuntu-latest
    needs: db
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18@sha256:c27c01f74af25bde5f4f0f69d01944c4fc7f0376ea53c72aa1180dd593ce1d52
        env:
          POSTGRES_USER: taxtronik
          POSTGRES_PASSWORD: taxtronik
          POSTGRES_DB: taxtronik
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taxtronik"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://taxtronik:taxtronik@localhost:5432/taxtronik?schema=public
      DATABASE_APP_URL: postgresql://taxtronik_app:taxtronik_app@localhost:5432/taxtronik?schema=public
      # Seed fix-codiertes Admin-Passwort → vermeidet das Schreiben von
      # .admin-credentials.txt und den zufälligen Passwort-Output in CI.
      ADMIN_PASSWORD: ci-restore-selftest-admin-pw
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Rebuild approved native packages
        run: pnpm rebuild -r @prisma/client @prisma/engines esbuild prisma sharp unrs-resolver

      - name: Generate Prisma client
        run: pnpm --filter @taxtronik/db exec prisma generate

      # Dieser Job ist der EINZIGE mit pg_dump/pg_restore (via runner.ts/
      # restore.ts). Anders als psql bricht pg_dump hart ab, wenn der Server
      # neuer ist als der Client („aborting because of server version
      # mismatch") — die Distro-Pakete (postgresql-client) sind älter als der
      # Postgres-18-Service. Daher Client 18 aus dem PGDG-Repo.
      - name: Install PostgreSQL 18 client (pg_dump/pg_restore)
        run: |
          # command -v-Guard: der Runner fährt run-Steps mit set -e -o pipefail.
          # Fehlt pg_dump komplett, würde `pg_dump --version | …` den Step
          # sofort mit 127 (command not found) beenden, bevor die Installation
          # überhaupt erreicht wird.
          MAJOR=0
          if command -v pg_dump >/dev/null 2>&1; then
            MAJOR="$(pg_dump --version | awk '{print $3}' | cut -d. -f1)"
          fi
          if [ "${MAJOR:-0}" -ge 18 ]; then
            echo "vorhanden: $(pg_dump --version)"
            exit 0
          fi
          SUDO=""
          if command -v sudo >/dev/null 2>&1; then SUDO=sudo; fi
          $SUDO apt-get update
          $SUDO apt-get install -y curl ca-certificates
          $SUDO install -d /usr/share/postgresql-common/pgdg
          $SUDO curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] http://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | $SUDO tee /etc/apt/sources.list.d/pgdg.list
          $SUDO apt-get update
          $SUDO apt-get install -y postgresql-client-18
          pg_dump --version

      - name: Bootstrap roles and extensions
        run: |
          PGPASSWORD=taxtronik psql -h localhost -U taxtronik -d taxtronik \
            -v ON_ERROR_STOP=1 -f packages/db/prisma/init/01_bootstrap.sql

      - name: Apply migrations
        run: pnpm --filter @taxtronik/db exec prisma migrate deploy

      - name: Seed demo data
        run: pnpm --filter @taxtronik/db seed

      - name: Backup→Restore self-test
        run: |
          set -o pipefail
          bash scripts/restore-selftest.sh 2>&1 | tee testbericht-restore.log

      - name: Testnachweis hochladen
        if: always()
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: testbericht-restore
          retention-days: 90
          path: testbericht-restore.log
          if-no-files-found: ignore

  # ===========================================================================
  # Upgrade-Pfad: simuliert das Kunden-Update. Eine DB wird auf den
  # Migrationsstand des LETZTEN Release-Tags gebracht, dann werden die
  # aktuellen Migrationen darauf angewendet — genau das passiert bei jedem
  # ./taxtronik update beim Kunden. Fängt nachträglich editierte
  # Migrations-Historie und Brüche im Migrations-Suffix, die der frische
  # Komplett-Durchlauf im db-Job nicht sieht. Solange kein v*-Tag existiert,
  # ist der Job ein No-Op.
  # ===========================================================================
  upgrade-path:
    name: Upgrade-Pfad (letztes Release → HEAD)
    runs-on: ubuntu-latest
    needs: restore
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18@sha256:c27c01f74af25bde5f4f0f69d01944c4fc7f0376ea53c72aa1180dd593ce1d52
        env:
          POSTGRES_USER: taxtronik
          POSTGRES_PASSWORD: taxtronik
          POSTGRES_DB: taxtronik
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taxtronik"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://taxtronik:taxtronik@localhost:5432/taxtronik?schema=public
      DATABASE_APP_URL: postgresql://taxtronik_app:taxtronik_app@localhost:5432/taxtronik?schema=public
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Letztes Release-Tag ermitteln
        id: last
        run: |
          git fetch --tags --force 2>/dev/null || true
          # Im Release-workflow_call ist der neu gepushte Tag bereits sichtbar.
          # Er darf nicht als Ausgangspunkt gewählt werden, sonst würde der
          # vermeintliche Upgrade-Test nur HEAD → HEAD prüfen.
          CURRENT_TAG=""
          case "${GITHUB_REF:-}" in
            refs/tags/v*) CURRENT_TAG="${GITHUB_REF_NAME:-}" ;;
          esac
          TAG="$(git tag --list 'v*' --sort=-v:refname | grep -vx "$CURRENT_TAG" | head -1 || true)"
          if [ -z "$TAG" ]; then
            echo "Kein v*-Tag vorhanden — Upgrade-Pfad-Test wird übersprungen."
          else
            echo "Teste Upgrade-Pfad ab Release: $TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        if: steps.last.outputs.tag != ''

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: steps.last.outputs.tag != ''
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: steps.last.outputs.tag != ''
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Rebuild approved native packages
        if: steps.last.outputs.tag != ''
        run: pnpm rebuild -r @prisma/client @prisma/engines esbuild prisma sharp unrs-resolver

      - name: Generate Prisma client
        if: steps.last.outputs.tag != ''
        run: pnpm --filter @taxtronik/db exec prisma generate

      - name: Install PostgreSQL client
        if: steps.last.outputs.tag != ''
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            if command -v sudo >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y postgresql-client
            else
              apt-get update
              apt-get install -y postgresql-client
            fi
          fi

      - name: Bootstrap roles and extensions
        if: steps.last.outputs.tag != ''
        run: |
          PGPASSWORD=taxtronik psql -h localhost -U taxtronik -d taxtronik \
            -v ON_ERROR_STOP=1 -f packages/db/prisma/init/01_bootstrap.sql

      - name: Migrationsstand des letzten Releases herstellen
        if: steps.last.outputs.tag != ''
        run: |
          set -euo pipefail
          TAG="${{ steps.last.outputs.tag }}"
          mkdir -p /tmp/release
          git archive "$TAG" packages/db/prisma/migrations | tar -x -C /tmp/release
          # Prisma 7: die Datasource-URL lebt in der Config, nicht im Schema.
          # Temporäre Config zeigt auf die Release-Migrationen; das Schema
          # (HEAD) dient nur der Provider-Validierung — `migrate deploy`
          # liest keine Models.
          cat > packages/db/upgrade-path.config.ts <<'EOF'
          import { defineConfig, env } from 'prisma/config';

          export default defineConfig({
            schema: 'prisma/schema.prisma',
            migrations: { path: '/tmp/release/packages/db/prisma/migrations' },
            datasource: { url: env('DATABASE_URL') },
          });
          EOF
          pnpm --filter @taxtronik/db exec prisma migrate deploy --config upgrade-path.config.ts
          rm packages/db/upgrade-path.config.ts

      - name: GwG-Migration 034 mit Altbestand in isolierter DB prüfen
        if: steps.last.outputs.tag != ''
        run: |
          set -euo pipefail
          CUTOFF='20260801003300_invoice_storno_unique'
          TARGET='/tmp/pre-gwg-034/packages/db/prisma/migrations'
          GWG_DB='taxtronik_gwg_034'
          export DATABASE_URL="postgresql://taxtronik:taxtronik@localhost:5432/${GWG_DB}?schema=public"

          PGPASSWORD=taxtronik createdb -h localhost -U taxtronik "$GWG_DB"
          PGPASSWORD=taxtronik psql -h localhost -U taxtronik -d "$GWG_DB" \
            -v ON_ERROR_STOP=1 -f packages/db/prisma/init/01_bootstrap.sql

          rm -rf /tmp/pre-gwg-034
          mkdir -p "$TARGET"
          cp packages/db/prisma/migrations/migration_lock.toml "$TARGET/"
          for dir in packages/db/prisma/migrations/20*; do
            name="${dir##*/}"
            if [[ "$name" > "$CUTOFF" ]]; then
              continue
            fi
            cp -a "$dir" "$TARGET/"
          done
          cat > packages/db/pre-gwg-034.config.ts <<'EOF'
          import { defineConfig, env } from 'prisma/config';

          export default defineConfig({
            schema: 'prisma/schema.prisma',
            migrations: { path: '/tmp/pre-gwg-034/packages/db/prisma/migrations' },
            datasource: { url: env('DATABASE_URL') },
          });
          EOF
          pnpm --filter @taxtronik/db exec prisma migrate deploy --config pre-gwg-034.config.ts
          rm packages/db/pre-gwg-034.config.ts

          PGPASSWORD=taxtronik psql -h localhost -U taxtronik -d "$GWG_DB" \
            -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO tenant (id, slug, name, updated_at)
          VALUES (
            '11111111-1111-4111-8111-111111111111',
            'upgrade-gwg-034',
            'Upgrade GwG 034 GmbH',
            CURRENT_TIMESTAMP
          );

          INSERT INTO client (id, tenant_id, kind, name, allow_active, updated_at)
          VALUES (
            '22222222-2222-4222-8222-222222222222',
            '11111111-1111-4111-8111-111111111111',
            'JURPERS',
            'Altbestand GmbH',
            FALSE,
            CURRENT_TIMESTAMP
          );

          INSERT INTO gwg_check (
            id, tenant_id, client_id, status, risk_level, risk_score,
            verified_at, valid_until, notes, updated_at
          ) VALUES (
            '33333333-3333-4333-8333-333333333333',
            '11111111-1111-4111-8111-111111111111',
            '22222222-2222-4222-8222-222222222222',
            'VERIFIED', 'MEDIUM', 10,
            CURRENT_TIMESTAMP - INTERVAL '1 day',
            CURRENT_TIMESTAMP + INTERVAL '5 years',
            'Alt-Snapshot', CURRENT_TIMESTAMP
          );

          INSERT INTO gwg_id_document (
            id, gwg_check_id, type, owner_name, number, issued_by, verified_at
          ) VALUES (
            '44444444-4444-4444-8444-444444444444',
            '33333333-3333-4333-8333-333333333333',
            'HANDELSREGISTERAUSZUG', 'Erika Altbestand', 'ALT-123',
            'Registerstelle', '2025-01-01'
          );

          INSERT INTO gwg_beneficial_owner (
            id, gwg_check_id, full_name, birth_date, residence, ownership_pct
          ) VALUES (
            '55555555-5555-4555-8555-555555555555',
            '33333333-3333-4333-8333-333333333333',
            'Max Altbestand', '1980-01-01', 'Berlin', 100.00
          );

          UPDATE client
             SET allow_active = TRUE, updated_at = CURRENT_TIMESTAMP
           WHERE id = '22222222-2222-4222-8222-222222222222';
          SQL

          pnpm --filter @taxtronik/db exec prisma migrate deploy

          PGPASSWORD=taxtronik psql -h localhost -U taxtronik -d "$GWG_DB" \
            -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF (SELECT status FROM gwg_check
                 WHERE id = '33333333-3333-4333-8333-333333333333')
               IS DISTINCT FROM 'EXPIRED'::gwg_status THEN
              RAISE EXCEPTION 'Migration 034 hat den unvollständigen Alt-Check nicht beendet';
            END IF;
            IF (SELECT allow_active FROM client
                 WHERE id = '22222222-2222-4222-8222-222222222222') IS DISTINCT FROM FALSE THEN
              RAISE EXCEPTION 'Migration 034 hat den Alt-Mandanten nicht fail-closed deaktiviert';
            END IF;
            IF (SELECT COUNT(*) FROM gwg_check
                 WHERE client_id = '22222222-2222-4222-8222-222222222222'
                   AND status = 'IN_REVIEW') <> 1 THEN
              RAISE EXCEPTION 'Migration 034 hat keinen eindeutigen Folge-Review angelegt';
            END IF;
            IF pg_catalog.to_regprocedure('app.destroy_gwg_check(uuid)') IS NULL THEN
              RAISE EXCEPTION 'app.destroy_gwg_check(uuid) fehlt nach Migration 034';
            END IF;
          END $$;
          SQL

          pnpm --filter @taxtronik/db exec prisma migrate status
          PGPASSWORD=taxtronik dropdb -h localhost -U taxtronik "$GWG_DB"

      - name: Onboarding-Abschluss-Backfill mit historischen GwG-Zustaenden pruefen
        if: steps.last.outputs.tag != ''
        run: |
          set -euo pipefail
          CUTOFF='20260801004000_poa_created_at_db_clock'
          TARGET='/tmp/pre-onboarding-041/packages/db/prisma/migrations'
          ONBOARDING_DB='taxtronik_onboarding_041'
          CONFIG='packages/db/onboarding-041.config.ts'

          cleanup() {
