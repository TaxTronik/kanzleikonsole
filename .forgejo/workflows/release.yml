# =============================================================================
# Release Images — baut web + worker und pusht sie in die Forgejo-Container-
# Registry. Ausgelöst durch einen Versions-Tag:
#
#   git tag v1.4.0 && git push forgejo v1.4.0
#
# Ergebnis: <registry>/<owner>/web:1.4.0 + :latest (analog worker). Der
# Registry-Host wird aus der Instanz-URL abgeleitet (GITHUB_SERVER_URL,
# z. B. git.hirschmann-koxha.de); via Repo-Variable REGISTRY übersteuerbar.
#
# Auth: Default ist der Actions-Auto-Token (GITHUB_TOKEN). Falls die Instanz
# dem Auto-Token kein write:package erlaubt, einen PAT mit write:package als
# Secrets REGISTRY_USER + REGISTRY_TOKEN hinterlegen — die werden bevorzugt.
#
# Trivy-Gate: CRITICAL-CVEs mit verfügbarem Fix blockieren den Push. HIGH wird
# nur rapportiert — Alpine-Basis-CVEs ohne Fix würden sonst jedes Release
# aufhalten.
#
# Zielmaschine (.env), danach ./taxtronik update:
#   TAXTRONIK_IMAGE_PREFIX=git.hirschmann-koxha.de/taxtronik
#   TAXTRONIK_VERSION=1.4.0
# Prozess-Doku: docs/operations/release.md
# =============================================================================
name: Release Images

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prefix: ${{ steps.meta.outputs.prefix }}
      web_digest: ${{ steps.push.outputs.web_digest }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Version, Registry und Build-Metadaten bestimmen
        id: meta
        env:
          REGISTRY_OVERRIDE: ${{ vars.REGISTRY }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          REGISTRY="${REGISTRY_OVERRIDE:-${GITHUB_SERVER_URL#*://}}"
          OWNER="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          {
            echo "version=$VERSION"
            echo "registry=$REGISTRY"
            echo "prefix=$REGISTRY/$OWNER"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Registry-Login
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ steps.meta.outputs.registry }}
          username: ${{ secrets.REGISTRY_USER || github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}

      # push: false + load: true — erst nach dem Trivy-Gate pushen. Kein
      # setup-buildx: der Docker-Driver legt die Images direkt im lokalen
      # Daemon ab, wo Trivy und `docker push` sie finden.
      - name: web — bauen
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: infra/docker/Dockerfile.web
          push: false
          load: true
          tags: |
            ${{ steps.meta.outputs.prefix }}/web:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.prefix }}/web:latest
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: worker — bauen
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: infra/docker/Dockerfile.worker
          push: false
          load: true
          tags: |
            ${{ steps.meta.outputs.prefix }}/worker:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.prefix }}/worker:latest
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Trivy-Scan (CRITICAL mit Fix blockt den Push)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/trivy"
          for img in web worker; do
            ref="${{ steps.meta.outputs.prefix }}/$img:${{ steps.meta.outputs.version }}"
            # Pass 1: HIGH+CRITICAL rapportieren (informativ, blockt nicht)
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$HOME/.cache/trivy:/root/.cache/trivy" \
              aquasec/trivy:latest@sha256:2a335d3a73d4e1d52d73c8ef417ab0f91f86ba0a912caf8227665b988a6f4015 image \
              --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 "$ref"
            # Pass 2: CRITICAL mit Fix → Release abbrechen
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$HOME/.cache/trivy:/root/.cache/trivy" \
              aquasec/trivy:latest@sha256:2a335d3a73d4e1d52d73c8ef417ab0f91f86ba0a912caf8227665b988a6f4015 image \
              --severity CRITICAL --ignore-unfixed --exit-code 1 --quiet "$ref"
          done

      - name: Push in die Registry
        id: push
        run: |
          set -euo pipefail
          for img in web worker; do
            docker push "${{ steps.meta.outputs.prefix }}/$img:${{ steps.meta.outputs.version }}"
            docker push "${{ steps.meta.outputs.prefix }}/$img:latest"
          done
          # Digest des gepushten web-Images fürs Update-Manifest (RepoDigests
          # ist erst NACH dem Push befüllt).
          DIGEST="$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' \
            "${{ steps.meta.outputs.prefix }}/web:${{ steps.meta.outputs.version }}" \
            | grep -F "${{ steps.meta.outputs.prefix }}/web@" | head -1 | cut -d@ -f2)"
          test -n "$DIGEST"
          echo "web_digest=$DIGEST" >> "$GITHUB_OUTPUT"

  # ===========================================================================
  # Signiertes Update-Manifest publizieren — die Admin-UI jeder Installation
  # zeigt dann „Update verfügbar" (apps/web/src/server/update/manifest.ts
  # verifiziert die Ed25519-Signatur fail-closed).
  #
  # Erst aktiv, wenn das Publishing-Ziel konfiguriert ist:
  #   vars.UPDATE_MANIFEST_REPO          = PUBLIC Repo, z. B.
  #       https://git.hirschmann-koxha.de/TaxTronik/updates.git
  #   secrets.UPDATE_MANIFEST_TOKEN      = Token mit Schreibrecht auf das Repo
  #   secrets.UPDATE_MANIFEST_PRIVATE_KEY= Ed25519 PKCS8-PEM
  #       (einmalig erzeugen: node scripts/release/generate-update-key.mjs)
  # Kunden-.env: UPDATE_MANIFEST_URL auf die Raw-URL des Manifests,
  #   z. B. https://git.hirschmann-koxha.de/TaxTronik/updates/raw/branch/main/manifest.json
  # plus UPDATE_PUBLIC_KEY (Ausgabe des Key-Skripts).
  # ===========================================================================
  manifest:
    needs: release
    if: vars.UPDATE_MANIFEST_REPO != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Manifest bauen, signieren und publizieren
        env:
          UPDATE_MANIFEST_PRIVATE_KEY: ${{ secrets.UPDATE_MANIFEST_PRIVATE_KEY }}
          MANIFEST_REPO: ${{ vars.UPDATE_MANIFEST_REPO }}
          MANIFEST_TOKEN: ${{ secrets.UPDATE_MANIFEST_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
          IMAGE: ${{ needs.release.outputs.prefix }}/web:${{ needs.release.outputs.version }}
          DIGEST: ${{ needs.release.outputs.web_digest }}
        run: |
          set -euo pipefail
          test -n "$MANIFEST_TOKEN" || { echo "secrets.UPDATE_MANIFEST_TOKEN fehlt"; exit 1; }
          test -n "$UPDATE_MANIFEST_PRIVATE_KEY" || { echo "secrets.UPDATE_MANIFEST_PRIVATE_KEY fehlt"; exit 1; }
          git fetch --tags --force 2>/dev/null || true
          TAG="$GITHUB_REF_NAME"

          # migrationsRequired: haben sich die Migrationen seit dem vorherigen
          # Release geändert? Erstes Release → konservativ true.
          PREV="$(git tag --list 'v*' --sort=-v:refname | grep -vx "$TAG" | head -1 || true)"
          MIG=true
          if [ -n "$PREV" ] && git diff --quiet "$PREV" "$TAG" -- packages/db/prisma/migrations; then
            MIG=false
          fi

          # Release-Notes = Tag-Annotation (bei lightweight Tags die Commit-Message).
          git tag -l --format='%(contents)' "$TAG" > /tmp/notes.txt

          # Bestehendes Manifest fortschreiben.
          REPO_NOSCHEME="${MANIFEST_REPO#https://}"
          git clone --depth 1 "https://x:${MANIFEST_TOKEN}@${REPO_NOSCHEME}" /tmp/updates

          ARGS=(--version "$VERSION" --image "$IMAGE" --image-digest "$DIGEST"
                --migrations-required "$MIG" --notes-file /tmp/notes.txt --out-dir /tmp/updates)
          if [ -f /tmp/updates/manifest.json ]; then ARGS+=(--in /tmp/updates/manifest.json); fi
          node scripts/release/build-update-manifest.mjs "${ARGS[@]}"

          cd /tmp/updates
          git add manifest.json manifest.json.sig
          git -c user.name=taxtronik-release -c user.email=release@taxtronik.invalid \
            commit -m "manifest: $VERSION"
          git push
