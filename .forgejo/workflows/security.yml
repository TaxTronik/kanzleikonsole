name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_call:
  schedule:
    # Taeglich statt woechentlich: Advisories erscheinen jederzeit, und ein
    # 7-Tage-Fenster war laenger als die Reaktionszeit, die wir uns geben
    # wollen. Die Update-PRs liefert das selbst gehostete Renovate
    # (renovate.yml, ClamAV täglich, die übrigen Gruppen montags).
    # Ein npm-Fix juenger als 7 Tage braucht die dokumentierte
    # minimumReleaseAgeExclude-Ausnahme in pnpm-workspace.yaml.
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.29.0
  GITLEAKS_LINUX_X64_SHA256: 39e07ad810336fd0ae80d0bd61c60d0521f628173e7583583b5df4a38738522c

jobs:
  service-images:
    name: Produktionsimages und ClamAV-Engine
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Prüfe Scanregeln und Image-Inventar
        run: node --test scripts/tests/service-image-security.test.mjs scripts/tests/postgres-gosu-assessment.test.mjs
      - name: Digest-gepinnten Trivy-Scanner bereitstellen
        run: bash scripts/ci/setup-trivy.sh
      - name: Produktive Fremdimages und Herstellerstand der ClamAV-Engine prüfen
        run: node scripts/ci/scan-service-images.mjs security-images
      - name: Imageberichte und betroffene Engine-Stände sichern
        if: always()
        uses: actions/upload-artifact@c6a366c94c3e0affe28c06c8df20a878f24da3cf # v3.2.2
        with:
          name: security-service-images
          retention-days: 90
          path: security-images/
          if-no-files-found: error

  dependencies:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Guard pnpm supply-chain policy
        run: sh scripts/check-pnpm-supply-chain.sh

      - name: Install dependencies
        run: bash scripts/ci/setup.sh install

      - name: Audit production dependencies
        run: |
          set -o pipefail
          pnpm audit --prod --audit-level high 2>&1 | tee security-audit-prod.log

      # Der blockierende Lauf oben deckt bewusst nur prod/high ab. Dev-
      # Dependencies fuehren aber auf Entwicklerrechnern und im Runner Code aus
      # — ein kompromittiertes Build-Tool ist der klassische Supply-Chain-Weg.
      # Dieser Lauf bricht nichts ab, macht das Bild aber vollstaendig und legt
      # es als Nachweis ab.
      - name: Audit full dependency graph (nicht blockierend)
        if: always()
        run: pnpm audit --audit-level low 2>&1 | tee security-audit-full.log || true

      - name: Dependency-audit evidence upload
        if: always()
        uses: actions/upload-artifact@c6a366c94c3e0affe28c06c8df20a878f24da3cf # v3.2.2
        with:
          name: security-audit-prod
          retention-days: 90
          path: |
            security-audit-prod.log
            security-audit-full.log
          if-no-files-found: ignore

  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -fsSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_LINUX_X64_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          chmod +x /tmp/gitleaks

      - name: Gitleaks-Allowlist gegen Gegenbeispiel prüfen
        run: bash scripts/tests/gitleaks-config.test.sh /tmp/gitleaks

      - name: Scan repository
        run: |
          set -o pipefail
          /tmp/gitleaks git --config .gitleaks.toml --redact --verbose . 2>&1 | tee security-gitleaks.log

      - name: Secret-scan evidence upload
        if: always()
        uses: actions/upload-artifact@c6a366c94c3e0affe28c06c8df20a878f24da3cf # v3.2.2
        with:
          name: security-gitleaks
          retention-days: 90
          path: security-gitleaks.log
          if-no-files-found: ignore
