name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_call:
  schedule:
    # Taeglich statt woechentlich: Advisories erscheinen jederzeit, und ein
    # 7-Tage-Fenster war laenger als die Reaktionszeit, die wir uns geben
    # wollen. Dependabot bleibt woechentlich — es liefert die Fixes, dieser
    # Lauf liefert die Kenntnis.
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.29.0
  GITLEAKS_LINUX_X64_SHA256: 39e07ad810336fd0ae80d0bd61c60d0521f628173e7583583b5df4a38738522c

jobs:
  dependencies:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm

      - name: Guard pnpm supply-chain policy
        run: sh scripts/check-pnpm-supply-chain.sh

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Audit production dependencies
        run: |
          set -o pipefail
          pnpm audit --prod --audit-level high 2>&1 | tee security-audit-prod.log

      # Der blockierende Lauf oben deckt bewusst nur prod/high ab. Dev-
      # Dependencies fuehren aber auf Entwicklerrechnern und im Runner Code aus
      # — ein kompromittiertes Build-Tool ist der klassische Supply-Chain-Weg.
      # Dieser Lauf bricht nichts ab, macht das Bild aber vollstaendig und legt
      # es als Nachweis ab.
      - name: Audit full dependency graph (nicht blockierend)
        if: always()
        run: pnpm audit --audit-level low 2>&1 | tee security-audit-full.log || true

      - name: Dependency-audit evidence upload
        if: always()
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: security-audit-prod
          retention-days: 90
          path: |
            security-audit-prod.log
            security-audit-full.log
          if-no-files-found: ignore

  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -fsSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_LINUX_X64_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          chmod +x /tmp/gitleaks

      - name: Gitleaks-Allowlist gegen Gegenbeispiel prüfen
        run: bash scripts/tests/gitleaks-config.test.sh /tmp/gitleaks

      - name: Scan repository
        run: |
          set -o pipefail
          /tmp/gitleaks git --config .gitleaks.toml --redact --verbose . 2>&1 | tee security-gitleaks.log

      - name: Secret-scan evidence upload
        if: always()
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: security-gitleaks
          retention-days: 90
          path: security-gitleaks.log
          if-no-files-found: ignore
