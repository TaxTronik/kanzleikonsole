# =============================================================================
# Build Images — baut taxtronik/web + taxtronik/worker zur VALIDIERUNG.
#
# BUILD-ONLY: KEIN Registry-Login, KEIN Push. Beweist nur, dass die Multi-
# Stage-Builds in CI durchlaufen (fängt Build-Brüche früh ab). Das eigentliche
# Release (Tag → Build → Trivy → Registry-Push) liegt in release.yml.
#
# Liegt unter .forgejo/workflows/ → läuft nur auf Forgejo (GitHub-Mirror ignoriert
# den Ordner).
#
# Auslöser: Push auf main (nur bei build-relevanten Änderungen) + manuell.
#
# VORAUSSETZUNG in Forgejo: Actions aktiviert + ein Runner, der Docker bauen kann
# (Host-Docker-Socket oder Docker-in-Docker; Label = runs-on unten). KEINE
# Registry/Secrets nötig, solange nur gebaut wird.
# =============================================================================
name: Build Images

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'infra/docker/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - '.forgejo/workflows/build-images.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: web — bauen (kein Push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.web
          push: false
          tags: taxtronik/web:ci

      - name: worker — bauen (kein Push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.worker
          push: false
          tags: taxtronik/worker:ci
