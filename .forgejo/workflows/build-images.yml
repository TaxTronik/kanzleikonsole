# =============================================================================
# Build Images — baut taxtronik/web + taxtronik/worker zur VALIDIERUNG.
#
# BUILD-ONLY: KEIN Registry-Login, KEIN Push. Beweist nur, dass die Multi-
# Stage-Builds in CI durchlaufen (fängt Build-Brüche früh ab). Das eigentliche
# Release (Tag → Build → Trivy → Registry-Push) liegt in release.yml.
#
# Liegt unter .forgejo/workflows/ → läuft nur auf Forgejo (GitHub-Mirror ignoriert
# den Ordner).
#
# Auslöser: Push auf main (nur bei build-relevanten Änderungen) + manuell.
#
# VORAUSSETZUNG in Forgejo: Actions aktiviert + ein Runner, der Docker bauen kann
# (Host-Docker-Socket oder Docker-in-Docker; Label = runs-on unten). KEINE
# Registry/Secrets nötig, solange nur gebaut wird.
# =============================================================================
name: Build Images

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'infra/docker/**'
      - 'scripts/check-docker-bases-pinned.mjs'
      - 'scripts/ops-lib.sh'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - '.dockerignore'
      - '.forgejo/workflows/build-images.yml'
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'infra/docker/**'
      - 'scripts/check-docker-bases-pinned.mjs'
      - 'scripts/ops-lib.sh'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - '.dockerignore'
      - '.forgejo/workflows/build-images.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - name: Guard pnpm supply-chain policy
        run: sh scripts/check-pnpm-supply-chain.sh

      - name: Guard pinned Docker base images
        run: node scripts/check-docker-bases-pinned.mjs

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Restriktiven Operator-Checkout simulieren
        run: |
          chmod 0700 \
            packages packages/db packages/db/scripts packages/db/prisma \
            packages/db/prisma/migrations \
            packages/db/prisma/migrations/20260801003400_gwg_fail_closed_and_destruction
          chmod 0600 \
            packages/db/scripts/migrate-deploy.sh \
            packages/db/prisma/migrations/20260801003400_gwg_fail_closed_and_destruction/migration.sql
          test "$(stat -c '%a' packages/db/scripts/migrate-deploy.sh)" = '600'
          test "$(stat -c '%a' packages/db/prisma/migrations/20260801003400_gwg_fail_closed_and_destruction/migration.sql)" = '600'

      - name: web — bauen (kein Push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: infra/docker/Dockerfile.web
          push: false
          tags: taxtronik/web:ci

      - name: worker — bauen (kein Push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: infra/docker/Dockerfile.worker
          push: false
          load: true
          tags: taxtronik/worker:ci

      - name: Migrationen im non-root Worker-Image lesen
        run: |
          docker run --rm --entrypoint sh taxtronik/worker:ci -eu -c '
            test "$(id -u)" = "1000"
            test -r /app/packages/db/scripts/migrate-deploy.sh
            test -r /app/packages/db/prisma/migrations/20260801003400_gwg_fail_closed_and_destruction/migration.sql
            test ! -w /app/packages/db/scripts/migrate-deploy.sh
            test ! -w /app/packages/db/prisma/migrations/20260801003400_gwg_fail_closed_and_destruction/migration.sql
            sh -n /app/packages/db/scripts/migrate-deploy.sh
          '
