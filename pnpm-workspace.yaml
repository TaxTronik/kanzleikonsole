packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  unrs-resolver: true

peerDependencyRules:
  allowedVersions:
    eslint: "10"
    nodemailer: "8"

overrides:
  "@hono/node-server": "^1.19.13"
  ioredis: "^5.11.0"
  postcss: "^8.5.15"
  # esbuild 0.28.0 is vulnerable (GHSA-gv7w-rqvm-qjhr); force the patched release.
  esbuild: "0.28.1"
  # vite <=8.0.15 is vulnerable (GHSA-fx2h-pf6j-xcff, GHSA-v6wh-96g9-6wx3).
  vite: "8.0.16"
  # tmp 0.2.6 is vulnerable (GHSA-7c78-jf6q-g5cm); force the patched release.
  tmp: "0.2.7"
  # js-yaml 4.1.1 is vulnerable (GHSA-h67p-54hq-rp68); force the patched release.
  js-yaml: "4.2.0"
  uuid: "^11.1.1"
  # node-tar: nur transitiv via unpdf>canvas>@mapbox/node-pre-gyp (Install-Tool,
  # Build ohnehin geblockt). 6.x ist EOL/unpatched — Fix nur im 7.5.x-Zweig
  # (GHSA-9ppj-qmqm-q256 u. a.). Force auf den gepatchten Zweig.
  tar: "7.5.16"

# pnpm 11: Workspace-Pakete in dependents per echtes Link-Hardlink statt
# Symlink injizieren. Der Wert steht im Lockfile; muss hier gespiegelt werden,
# sonst meldet `pnpm install --frozen-lockfile` einen Config-Mismatch.
injectWorkspacePackages: true

# pnpm 11: Build-Scripts (postinstall etc.) sind per Default deaktiviert.
# Hier explizit die Pakete listen, deren Build-Hooks wir laufen lassen wollen.
# Alles andere bleibt geblockt — Supply-Chain-Härtung gegen bösartige
# postinstall-Scripts in transitiven Deps.
onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - prisma
  - esbuild
  - sharp
  - unrs-resolver
