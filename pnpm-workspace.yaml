packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  unrs-resolver: true

peerDependencyRules:
  allowedVersions:
    eslint: "10"
    nodemailer: "8"

overrides:
  "@hono/node-server": "^1.19.13"
  ioredis: "^5.11.0"
  postcss: "^8.5.15"
  tmp: "^0.2.6"
  uuid: "^11.1.1"

# pnpm 11: Workspace-Pakete in dependents per echtes Link-Hardlink statt
# Symlink injizieren. Der Wert steht im Lockfile; muss hier gespiegelt werden,
# sonst meldet `pnpm install --frozen-lockfile` einen Config-Mismatch.
injectWorkspacePackages: true

# pnpm 11: Build-Scripts (postinstall etc.) sind per Default deaktiviert.
# Hier explizit die Pakete listen, deren Build-Hooks wir laufen lassen wollen.
# Alles andere bleibt geblockt — Supply-Chain-Härtung gegen bösartige
# postinstall-Scripts in transitiven Deps.
onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - prisma
  - esbuild
  - sharp
  - unrs-resolver
