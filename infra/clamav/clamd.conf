# =============================================================================
# clamd.conf — Override für das offizielle clamav/clamav-Image.
#
# RF-14: Die App erlaubt Uploads bis MAX_UPLOAD_BYTES = 100 MB
# (packages/storage/src/service.ts). Die Stock-Konfiguration des Images
# begrenzt INSTREAM aber auf StreamMaxLength 25M — Uploads zwischen 25 und
# 100 MB schlugen damit systematisch mit SCAN_ERROR fehl (clamd bricht den
# Stream mit "INSTREAM size limit exceeded" ab). Limits hier mit Puffer
# oberhalb des App-Limits gesetzt.
#
# Wird in infra/compose/docker-compose.yml nach /etc/clamav/clamd.conf
# gemountet (read-only) und ersetzt die Stock-Conf vollständig — deshalb
# stehen auch die Basis-Direktiven (TCP, LocalSocket, Foreground) hier.
# =============================================================================

LogTime yes
# LocalSocket braucht der Image-Healthcheck (clamdcheck.sh / clamdscan --ping).
LocalSocket /tmp/clamd.sock
TCPSocket 3310
TCPAddr 0.0.0.0
Foreground yes

# Upload-Limit der App: 100 MB — clamd-Limits mit Puffer darüber.
StreamMaxLength 110M
MaxFileSize 110M
MaxScanSize 120M
