# =============================================================================
# CI-Override NUR für den Deploy-Readiness-Job (.forgejo/workflows/ci.yml) und
# den Release-Image-Stack-Smoke (scripts/release/smoke-release-images.sh).
#
# Warum: Der Forgejo-/act-Runner führt `docker compose` gegen den durchgereichten
# HOST-Docker-Daemon aus. Der Daemon sieht das Job-Workspace (/workspace/…) NICHT
# — bind-mountet man von dort eine einzelne Datei, legt Docker die fehlende Quelle
# als leeres VERZEICHNIS an. Das Mounten eines Verzeichnisses auf die im Image
# vorhandene Datei (z. B. /etc/clamav/clamd.conf) scheitert dann hart mit
# "Are you trying to mount a directory onto a file". Betrifft alle drei Einzel-
# datei-Mounts: clamd.conf, s3.json, init-storage.sh.
#
# Fix: Die drei Config-Artefakte werden per `build.dockerfile_inline` in kurzlebige
# CI-Images GEBACKT (der Build-Context wird von compose zum Daemon gestreamt und
# ist damit host-pfad-unabhängig). `volumes: !override` ersetzt die komplette
# Mount-Liste und wirft so den fragilen Datei-Bind raus. Ports/Command/Healthcheck/
# Hardening bleiben aus der Basis-Datei — es wird DIESELBE Prod-Konfiguration
# (identische Image-Digests + reale Init-/Config-/Workflow-Dateien) geprüft,
# nur der Einschleusweg der Workspace-Dateien ist ein anderer.
#
# WIRD IN PROD NICHT VERWENDET (Prod nutzt nur docker-compose.yml).
# =============================================================================

services:
  postgres:
    build:
      context: ../scripts
      dockerfile_inline: |
        FROM postgres:18-alpine@sha256:96d56f7f57c6aacd1fcb908bc83b345ec5f83231ee486dd66a1baadce274db88
        COPY postgres-init.sh /docker-entrypoint-initdb.d/01-init.sh
        RUN chmod 0555 /docker-entrypoint-initdb.d/01-init.sh
    image: ${TAXTRONIK_SMOKE_POSTGRES_IMAGE:-taxtronik-postgres-ci:latest}
    volumes: !override
      - postgres_data:/var/lib/postgresql

  seaweedfs:
    build:
      context: ../scripts
      dockerfile_inline: |
        FROM chrislusf/seaweedfs:4.41@sha256:43b768cd62b00d132439cda881b93fd1adebf1b315e996e794087743821d771d
        COPY seaweedfs-s3.template.json /etc/seaweedfs/s3.template.json
        COPY seaweedfs-entrypoint.sh /usr/local/bin/taxtronik-seaweedfs-entrypoint.sh
        RUN chmod 0555 /usr/local/bin/taxtronik-seaweedfs-entrypoint.sh
    image: taxtronik-seaweedfs-ci:latest
    volumes: !override
      - seaweed_data:/data

  seaweedfs-init:
    build:
      context: ../scripts
      dockerfile_inline: |
        FROM amazon/aws-cli:latest@sha256:c95ab0642137f55a12b95b6956dd03cefdbd73e760e0e7b870afc9b47f9c8150
        COPY init-storage.sh /init-storage.sh
    image: taxtronik-awscli-ci:latest
    volumes: !override []

  clamav:
    build:
      context: ../clamav
      dockerfile_inline: |
        FROM clamav/clamav:stable@sha256:d4000290254603e7ee45d4904425c7d98c015af727f402756198fe41a31e7777
        COPY clamd.conf /etc/clamav/clamd.conf
    image: taxtronik-clamav-ci:latest
    volumes: !override
      - clamav_data:/var/lib/clamav

  n8n:
    build:
      context: ../n8n
      dockerfile_inline: |
        FROM n8nio/n8n:2.33.7@sha256:3989d9b8ebb77b4ee8f604519eb73e44f4384bfaa689526e0104eed79a237d30
        COPY --chown=node:node workflows /workflows
    image: ${TAXTRONIK_SMOKE_N8N_IMAGE:-taxtronik-n8n-ci:latest}
    volumes: !override
      - n8n_data:/home/node/.n8n
