# =============================================================================
# Dev-Override — fügt Hilfsdienste für lokale Entwicklung hinzu:
#   - Mailhog  (SMTP-Catcher, Web-UI auf http://localhost:8025)
#   - n8n      (Workflow-Engine, UI auf http://localhost:5678)
#
# Verwendung:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Defaults sind so gesetzt, dass `docker compose up` ohne weitere Konfiguration
# läuft. Für produktiven Einsatz wechselt man auf docker-compose.app.yml und
# pflegt eigene Secrets in der .env.
# =============================================================================

# P-11: Hardening-Anchor — siehe docker-compose.yml. Compose merged Anchors
# pro File; daher hier nochmal definieren.
x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  mailhog:
    <<: *hardening
    image: mailhog/mailhog:latest@sha256:8d76a3d4ffa32a3661311944007a415332c4bb855657f4f6c57996405c009bea
    container_name: taxtronik-mailhog
    restart: unless-stopped
    ports:
      # P-4: Dev-Tools an localhost binden — Mailhog hat keine Auth.
      - "127.0.0.1:1025:1025"   # SMTP
      - "127.0.0.1:8025:8025"   # Web-UI

  n8n:
    <<: *hardening
    image: n8nio/n8n:2.33.7@sha256:3989d9b8ebb77b4ee8f604519eb73e44f4384bfaa689526e0104eed79a237d30
    container_name: taxtronik-n8n
    restart: unless-stopped
    # n8n läuft als node-User; braucht CHOWN für /home/node/.n8n.
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: Europe/Berlin
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-dev-only-n8n-encryption-key-xxxxxxxx}
      # Auch lokal Secrets nur als n8n-Credentials pflegen.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: 'true'
      N8N_BLOCK_FILE_ACCESS_TO_N8N_FILES: 'true'
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: 'true'
      N8N_COMMUNITY_PACKAGES_ENABLED: 'false'
      NODES_EXCLUDE: '["n8n-nodes-base.executeCommand","n8n-nodes-base.readWriteFile","n8n-nodes-base.localFileTrigger"]'
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: none
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: 'false'
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: 'false'
      EXECUTIONS_DATA_PRUNE: 'true'
      EXECUTIONS_DATA_MAX_AGE: 24
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: 1000
      # SQLite-Default — keine Postgres-Konfiguration nötig. Für Production
      # nutzt docker-compose.app.yml einen separaten n8n-DB-User in Postgres.
      DB_TYPE: sqlite
      N8N_SECURE_COOKIE: 'false'
      N8N_DIAGNOSTICS_ENABLED: 'false'
    ports:
      # P-4: n8n-UI hat zwar Login, aber für Dev reicht 127.0.0.1.
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ../n8n/workflows:/workflows:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  n8n_data:
