# =============================================================================
# Override für App-Services (Iter. 2+): app, worker, n8n
#
# Wird zusätzlich zur Basis-Compose geladen:
#   docker compose -f docker-compose.yml -f docker-compose.app.yml up -d
# =============================================================================

# P-11: Hardening-Anchor — siehe docker-compose.yml. Compose merged Anchors
# pro File; daher hier nochmal definieren.
x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

# Log-Rotation — siehe docker-compose.yml (Anchors gelten pro File).
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  app:
    <<: [*hardening, *logging]
    # Image-Prefix parametrisiert: Default `taxtronik` (lokaler Build via
    # ./taxtronik deploy). Für Registry-Pull in der .env setzen, z. B.
    # TAXTRONIK_IMAGE_PREFIX=git.kanzlei.de/rey → git.kanzlei.de/rey/web:<version>.
    image: ${TAXTRONIK_IMAGE_PREFIX:-taxtronik}/web:${TAXTRONIK_VERSION:-dev}
    container_name: taxtronik-app
    restart: unless-stopped
    mem_limit: ${APP_MEM_LIMIT:-2g}
    # Laufende Requests beim Update/Restart sauber abschließen lassen (Default
    # 10 s ist für SSR-/Export-Requests knapp).
    stop_grace_period: 30s
    # Next.js läuft als node-User; keine zusätzlichen Caps nötig (Port 3000
    # ist >1024, kein NET_BIND_SERVICE benötigt).
    read_only: true
    # Next.js / Node brauchen /tmp für TmpDir-Operationen; .next-Cache liegt
    # im Image. tmpfs minimiert das Write-Surface gegenüber root-FS.
    tmpfs:
      - /tmp:size=64m,mode=1777
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      clamav:
        condition: service_healthy
      # Schema muss aktuell sein, bevor die App startet (one-shot, s. u.).
      migrate:
        condition: service_completed_successfully
      backup-dir-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://taxtronik:${POSTGRES_PASSWORD}@postgres:5432/taxtronik?schema=public
      DATABASE_APP_URL: postgresql://taxtronik_app:${TAXTRONIK_APP_PASSWORD}@postgres:5432/taxtronik?schema=public
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: ${AUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      # Production-Pflicht: muss explizit true/false sein (Host-Header-S9).
      NEXTAUTH_TRUST_HOST: ${NEXTAUTH_TRUST_HOST:-true}
      # Mandanten-facing Links (Magic-Link, GwG, Portal-Forms). Leer →
      # Fallback auf NEXTAUTH_URL.
      PORTAL_PUBLIC_URL: ${PORTAL_PUBLIC_URL:-}
      # Cookie-Trennung Staff/Portal (S12). Leer → Single-Host-Deploy (Warnung).
      STAFF_COOKIE_DOMAIN: ${STAFF_COOKIE_DOMAIN:-}
      PORTAL_COOKIE_DOMAIN: ${PORTAL_COOKIE_DOMAIN:-}
      # R2/H2: Production-Default ist `true` — das Image erwartet einen
      # Reverse-Proxy (nginx/caddy/traefik) auf dem Host, der X-Forwarded-For
      # korrekt befüllt und client-supplied Werte stripped. Wer ohne Proxy
      # direkt ans Internet bindet (gegen P-4-Empfehlung), MUSS explizit
      # `TRUST_PROXY_REQUIRED=false` in der .env setzen — dann ignoriert
      # getClientIp die Header komplett (kein Spoofing, aber Rate-Limit/
      # Audit-IP/Lockout-Distinct-IP fallen auf 'unknown').
      TRUST_PROXY_REQUIRED: ${TRUST_PROXY_REQUIRED:-true}
      # Object-Store nur intern erreichbar — App streamt Up-/Downloads selbst.
      S3_ENDPOINT: http://seaweedfs:8333
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET_BACKUPS: backups
      BACKUP_LOCAL_DIR: ${BACKUP_LOCAL_DIR:-/app/backups}
      # B-1: gwg-Bucket explizit setzen — Default-Zod-Wert ist 'gwg', aber
      # für Doku/Override-Transparenz besser hier sichtbar.
      S3_BUCKET_GWG: gwg
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST nicht gesetzt - Prod braucht ein echtes SMTP-Relay; Mailhog nur in docker-compose.dev.yml}
      SMTP_PORT: ${SMTP_PORT:?SMTP_PORT nicht gesetzt}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:?SMTP_FROM nicht gesetzt}
      N8N_WEBHOOK_BASE_URL: http://n8n:5678/webhook
      N8N_HMAC_SECRET: ${N8N_HMAC_SECRET}
      # Risk-Layer / TCMS-Engine (§4) — opt-in.
      # Leer => Modul inaktiv. Aktivieren nur mit RISK_LAYER_URL, RISK_LAYER_TOKEN
      # und Compose-Profil `risk-layer`.
      RISK_LAYER_URL: ${RISK_LAYER_URL:-}
      RISK_LAYER_TOKEN: ${RISK_LAYER_TOKEN:-}
      # ELSTER / eric-bridge — opt-in (Muster Risk-Layer). Leer => Modul
      # unsichtbar. Aktivieren nur mit ELSTER_BRIDGE_URL, ELSTER_BRIDGE_TOKEN
      # und Compose-Profil `elster`.
      ELSTER_BRIDGE_URL: ${ELSTER_BRIDGE_URL:-}
      ELSTER_BRIDGE_TOKEN: ${ELSTER_BRIDGE_TOKEN:-}
      # SSRF-Guard-Allowlist: die Docker-Service-Namen lösen auf private
      # 172.x-Adressen auf. Ohne diese Liste blockt der Guard die n8n-Bridge
      # ("Hostname löst auf private Adresse auf"). Per .env überschreibbar.
      INTERNAL_FETCH_HOSTS: ${INTERNAL_FETCH_HOSTS:-n8n,seaweedfs,clamav,postgres,redis}
      APP_VERSION: ${TAXTRONIK_VERSION:-dev}
      # RFC-3161-Zeitstempel für Audit-Chain/Backup-Drill. Ohne Wert greift der
      # LocalTimestampAdapter — in Production verlangt @taxtronik/config aber
      # eine externe TSA. MUSS daher durchgereicht werden (sonst still lokal).
      TIMESTAMP_AUTHORITY_URL: ${TIMESTAMP_AUTHORITY_URL:-}
      # Optionaler dedizierter Secret-Box-Key (Rotation). Leer → Fallback
      # AUTH_SECRET; ein später gesetzter Wert darf nicht still ignoriert werden.
      SECRET_BOX_KEY: ${SECRET_BOX_KEY:-}
      # Prisma-Connection-Pool-Größe (Tuning). Leer → Prisma-Default.
      DATABASE_CONNECTION_LIMIT: ${DATABASE_CONNECTION_LIMIT:-}
      # Update-Check (server/update): ohne diese Werte meldet die App dauerhaft
      # „nicht konfiguriert" — der Betreiber erführe nie von Updates.
      UPDATE_MANIFEST_URL: ${UPDATE_MANIFEST_URL:-}
      UPDATE_PUBLIC_KEY: ${UPDATE_PUBLIC_KEY:-}
      # Lizenzprüfung (server/license).
      LICENSE_KEY: ${LICENSE_KEY:-}
      LICENSE_PUBLIC_KEY: ${LICENSE_PUBLIC_KEY:-}
    ports:
      # P-4: An 127.0.0.1 binden — Reverse-Proxy auf dem Host (nginx/caddy/
      # traefik) terminiert TLS und reicht auf 127.0.0.1:${APP_BIND_PORT:-3000}
      # durch. Falls Port 3000 schon belegt ist, in der .env überschreiben:
      #   APP_BIND_PORT=3001
      # NEXTAUTH_URL bleibt dabei unverändert (zeigt auf die public Subdomain).
      - "${APP_BIND:-127.0.0.1}:${APP_BIND_PORT:-3000}:3000"
    volumes:
      # Browser-triggered Backups: lokale Operator-Kopie im Repo-Root unter
      # ./backups, im read-only Container als gezielt schreibbares Volume.
      - ${BACKUP_HOST_DIR:-../../backups}:/app/backups

  backup-dir-init:
    <<: [*hardening, *logging]
    image: ${TAXTRONIK_IMAGE_PREFIX:-taxtronik}/worker:${TAXTRONIK_VERSION:-dev}
    container_name: taxtronik-backup-dir-init
    restart: "no"
    user: "0:0"
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    command:
      - sh
      - -c
      - >-
        mkdir -p /app/backups &&
        chown 1000:1000 /app/backups &&
        chmod 0770 /app/backups
    volumes:
      # Gleicher Bind-Mount wie app. Korrigiert Host-Pfade, die Docker vorher
      # root-owned angelegt hat; danach kann der node-User der App schreiben.
      - ${BACKUP_HOST_DIR:-../../backups}:/app/backups

  worker:
    <<: [*hardening, *logging]
    image: ${TAXTRONIK_IMAGE_PREFIX:-taxtronik}/worker:${TAXTRONIK_VERSION:-dev}
    container_name: taxtronik-worker
    restart: unless-stopped
    mem_limit: ${WORKER_MEM_LIMIT:-2g}
    # Lange Jobs (backup-drill/pg_restore, evidence-seal, risk-analyse-llm bis
    # 180 s, Verify-Walk) beim Update sauber zu Ende laufen lassen, bevor
    # SIGKILL greift. Der Shutdown-Handler wartet bereits auf worker.close().
    stop_grace_period: 180s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      clamav:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://taxtronik:${POSTGRES_PASSWORD}@postgres:5432/taxtronik?schema=public
      # Production-Pflicht laut @taxtronik/config (RLS-Backstop): der Worker
      # nutzt ebenfalls die eingeschränkte App-Rolle, nicht den DB-Owner.
      DATABASE_APP_URL: postgresql://taxtronik_app:${TAXTRONIK_APP_PASSWORD}@postgres:5432/taxtronik?schema=public
      # Production-Pflicht: muss explizit true/false sein (Host-Header-S9).
      NEXTAUTH_TRUST_HOST: ${NEXTAUTH_TRUST_HOST:-true}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      AUTH_SECRET: ${AUTH_SECRET}
      # Worker stellt n8n-Outbox zu → braucht das HMAC-Secret (min 32, prod-Pflicht).
      N8N_HMAC_SECRET: ${N8N_HMAC_SECRET}
      N8N_WEBHOOK_BASE_URL: http://n8n:5678/webhook
      # SSRF-Guard-Allowlist (Worker stellt n8n-Outbox zu → safeFetch zu n8n).
      INTERNAL_FETCH_HOSTS: ${INTERNAL_FETCH_HOSTS:-n8n,seaweedfs,clamav,postgres,redis}
      TRUST_PROXY_REQUIRED: ${TRUST_PROXY_REQUIRED:-true}
      REDIS_URL: redis://redis:6379
      # Object-Store nur intern erreichbar — App streamt Up-/Downloads selbst.
      S3_ENDPOINT: http://seaweedfs:8333
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET_GOBD: gobd
      S3_BUCKET_GWG: gwg
      S3_BUCKET_GENERAL: general
      S3_BUCKET_STAFF_PRIVATE: staff-private
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST nicht gesetzt - Prod braucht ein echtes SMTP-Relay; Mailhog nur in docker-compose.dev.yml}
      SMTP_PORT: ${SMTP_PORT:?SMTP_PORT nicht gesetzt}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:?SMTP_FROM nicht gesetzt}
      # Betriebs-Alarme (health-alert-Job): Down-/Up-Mails bei Infrastruktur-
      # Ausfall. Leer = Alerting aus.
      OPS_ALERT_EMAIL: ${OPS_ALERT_EMAIL:-}
      # RFC-3161-Zeitstempel: audit-verify-check/backup-drill/evidence-seal
      # laufen im Worker — ohne diesen Wert fallen sie still auf den
      # LocalTimestampAdapter, obwohl Prod eine externe TSA verlangt.
      TIMESTAMP_AUTHORITY_URL: ${TIMESTAMP_AUTHORITY_URL:-}
      SECRET_BOX_KEY: ${SECRET_BOX_KEY:-}
      DATABASE_CONNECTION_LIMIT: ${DATABASE_CONNECTION_LIMIT:-}
      # Risk-Layer/LLM: der risk-analyse-llm-Job instanziiert den RiskLayerClient
      # im WORKER — ohne diese Werte wirft er RiskLayerNotConfiguredError und
      # llmEnrichedAt wird nie gesetzt (app hat sie, worker fehlte sie).
      RISK_LAYER_URL: ${RISK_LAYER_URL:-}
      RISK_LAYER_TOKEN: ${RISK_LAYER_TOKEN:-}
      # ELSTER / eric-bridge — opt-in, siehe app-Service.
      ELSTER_BRIDGE_URL: ${ELSTER_BRIDGE_URL:-}
      ELSTER_BRIDGE_TOKEN: ${ELSTER_BRIDGE_TOKEN:-}

  # ===========================================================================
  # Einmal-Migration: wendet Prisma-Migrationen an, BEVOR app/worker starten
  # (depends_on: service_completed_successfully). Nutzt das Worker-Image wieder
  # — es enthält Prisma-CLI (volle node_modules) + die Migrationen (packages/db)
  # → kein eigenes Image nötig, und die Zielmaschine braucht für Migrationen
  # weder Node noch den Quellcode. Idempotent (migrate deploy = no-op, wenn
  # bereits aktuell). Rollen/Extensions legt der Postgres-Init-Container an.
  # ===========================================================================
  migrate:
    <<: [*hardening, *logging]
    image: ${TAXTRONIK_IMAGE_PREFIX:-taxtronik}/worker:${TAXTRONIK_VERSION:-dev}
    container_name: taxtronik-migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Migrationen brauchen DDL → Owner-Rolle (taxtronik), nicht die App-Rolle.
      DATABASE_URL: postgresql://taxtronik:${POSTGRES_PASSWORD}@postgres:5432/taxtronik?schema=public
    command:
      - sh
      - -c
      - >-
        cd /app/packages/db;
        PRISMA=$$(find /app/node_modules -path '*/prisma/build/index.js' -not -path '*/cache/*' 2>/dev/null | head -1);
        test -n "$$PRISMA" || { echo 'FATAL: prisma CLI nicht im Image gefunden'; exit 1; };
        exec node "$$PRISMA" migrate deploy

  n8n:
    <<: [*hardening, *logging]
    image: n8nio/n8n:latest@sha256:1872cce3548bf4dcfe5aceaf3d9293f4499635823fbdea0ee726bd222d2e44b8
    container_name: taxtronik-n8n
    restart: unless-stopped
    mem_limit: ${N8N_MEM_LIMIT:-1g}
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    environment:
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      GENERIC_TIMEZONE: Europe/Berlin
      TAXTRONIK_API_URL: http://app:3000
      N8N_HMAC_SECRET: ${N8N_HMAC_SECRET}
      SMTP_FROM: ${SMTP_FROM:?SMTP_FROM nicht gesetzt}
      GWG_OFFICER_EMAIL: ${GWG_OFFICER_EMAIL:-admin@taxtronik.local}
      # Eigene Verschlüsselung der gespeicherten Credentials
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:?N8N_DB_PASSWORD nicht gesetzt}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # P-4: n8n-UI hinter Reverse-Proxy. Direkt-Exposition nur über
      # ${N8N_BIND} explizit anschalten.
      - "${N8N_BIND:-127.0.0.1}:5678:5678"
    # P3-6: einziger Dauer-Service, der bisher keinen Healthcheck hatte —
    # `./taxtronik ps`/doctor konnten einen n8n-Hänger nicht von „läuft"
    # unterscheiden.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - n8n_data:/home/node/.n8n
      - ../n8n/workflows:/workflows:ro

  # ===========================================================================
  # Risk-Layer / TCMS-Engine (§4).
  #
  # Netzinterne Analyse-Engine (deterministisch + Embedding + optional LLM).
  # NICHT nach außen exponiert: kein Host-Port, nur die App im internen
  # taxtronik-Netz spricht sie an — mit Bearer-Token (RISK_LAYER_TOKEN). Daten
  # bleiben on-prem (konsistent mit der Ablehnung externer LLMs).
  #
  # Opt-in: startet nur mit dem Profil. Stack ohne Engine:
  #   docker compose -f docker-compose.yml -f docker-compose.app.yml up -d
  # Stack MIT Engine:
  #   docker compose --profile risk-layer -f docker-compose.yml -f docker-compose.app.yml up -d
  #
  # GPU (optional, Embedding-Schicht): das Image baut sonst auf CPU. Für ROCm/
  # Vulkan-Passthrough zusätzlich (Host-abhängig) freischalten:
  #   devices:
  #     - /dev/dri:/dev/dri
  #     - /dev/kfd:/dev/kfd          # ROCm
  #   und RISK_LAYER_DEVICE=gpu setzen.
  # ===========================================================================
  risk-layer:
    <<: [*hardening, *logging]
    image: ${RISK_LAYER_IMAGE:-taxtronik/risk-layer:latest}
    container_name: taxtronik-risk-layer
    restart: unless-stopped
    profiles: ["risk-layer"]
    # LLM-Layer — Limit an das geladene Modell anpassen.
    mem_limit: ${RISK_LAYER_MEM_LIMIT:-4g}
    environment:
      # Shared Secret — identisch zu RISK_LAYER_TOKEN der App (Bearer-Auth).
      # Bewusst ${...:-} statt :? : Compose interpoliert Variablen ALLER Services
      # schon beim Datei-Laden, auch bei inaktiven Profilen. :? wuerde also JEDEn
      # compose-Aufruf (migrate, up, ps, ...) abbrechen, sobald risk-layer nicht
      # genutzt wird. Die Token-Pflicht (min 32) greift erst, wenn das Profil
      # aktiviert wird (App validiert RISK_LAYER_TOKEN beim Boot).
      RISK_LAYER_TOKEN: ${RISK_LAYER_TOKEN:-}
      RISK_LAYER_DEVICE: ${RISK_LAYER_DEVICE:-cpu}
    volumes:
      # Katalog + Corpus (Graph/Embedding) sind regenerierbar und enthalten
      # KEINE Mandantendaten. Named Volumes: überleben Neustarts, jederzeit
      # neu aufbaubar.
      - risk_layer_katalog:/data/katalog
      - risk_layer_corpus:/data/corpus
    healthcheck:
      # Python-Image → urllib statt curl/wget (nicht garantiert vorhanden).
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=5).status==200 else 1)"
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 40s

  # ===========================================================================
  # ELSTER / eric-bridge (privates Repo taxtronik-eric-bridge).
  #
  # Kapselt die native ERiC-Bibliothek als eigenen Debian-Dienst (glibc-Pflicht;
  # app/worker laufen auf Alpine/musl). NICHT nach außen exponiert: kein
  # Host-Port, nur app/worker sprechen ihn im internen Netz an — mit
  # Bearer-Token (ELSTER_BRIDGE_TOKEN).
  #
  # Die ERiC-Distribution ist vertraulich (ELSTER-Lizenzvereinbarung § 14) und
  # deshalb WEDER im Image NOCH in einem Repo: sie liegt auf dem Server unter
  # ${ERIC_DIST_DIR} und kommt als read-only Volume. Ein ERiC-Update ist damit
  # ein Volume-Tausch, kein Image-Rebuild (Mindestversions-Pflicht, § 5).
  #
  # Das Image wird AUSSERHALB dieses Repos gebaut (privates Repo
  # taxtronik-eric-bridge): auf dem Server `docker build -t
  # taxtronik/eric-bridge:<version> .` im Bridge-Checkout, oder Pull aus der
  # privaten Registry via ERIC_BRIDGE_IMAGE.
  #
  # Opt-in: startet nur mit dem Profil. Stack MIT ELSTER-Modul:
  #   docker compose --profile elster -f docker-compose.yml -f docker-compose.app.yml up -d
  # Zusätzlich in der .env: ELSTER_BRIDGE_URL=http://eric-bridge:8085,
  # ELSTER_BRIDGE_TOKEN, ERIC_HERSTELLER_ID, ERIC_DIST_DIR, ERIC_CERT_FILE.
  # ===========================================================================
  eric-bridge:
    <<: [*hardening, *logging]
    image: ${ERIC_BRIDGE_IMAGE:-taxtronik/eric-bridge:latest}
    container_name: taxtronik-eric-bridge
    restart: unless-stopped
    profiles: ["elster"]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      # Shared Secret — identisch zu ELSTER_BRIDGE_TOKEN der App (Bearer-Auth).
      # ${...:-} statt :? — Begründung siehe risk-layer (Interpolation trifft
      # auch inaktive Profile). Die Bridge selbst bricht beim Start ab, wenn
      # das Token fehlt oder zu kurz ist (min 16 Zeichen).
      BRIDGE_TOKEN: ${ELSTER_BRIDGE_TOKEN:-}
      # Hersteller-ID: Geheimnis der ELSTER-Lizenzvereinbarung. Lebt NUR hier
      # (Bridge-Env) — nie in Code, App-Konfiguration oder Beispieldaten.
      # Ohne sie bleibt /v1/abfrage bzw. /v1/kontoabfrage deaktiviert (503).
      ERIC_HERSTELLER_ID: ${ERIC_HERSTELLER_ID:-}
    volumes:
      # ERiC-Distribution (…/Linux-x86_64/lib der entpackten Distribution),
      # z. B. /opt/taxtronik/eric/44.1.6.0/lib. Read-only.
      - ${ERIC_DIST_DIR:-/opt/taxtronik/eric/current}/lib:/opt/eric/lib:ro
      # eric.log kann personenbezogene Daten enthalten (§ 15): eigenes Volume,
      # ERiC rotiert selbst (~10 MiB), Zugriff nur Admin, nie weiterleiten.
      - eric_logs:/var/log/eric
      # Portalzertifikat (.pfx) der Kanzlei — nur für Stufe 2 (Kontoabfrage/
      # Versand). Ohne echtes Zertifikat bleibt /dev/null gemountet und die
      # authentifizierten Endpunkte antworten 503.
      - ${ERIC_CERT_FILE:-/dev/null}:/opt/eric/cert/cert.pfx:ro
    healthcheck:
      # Node-Image → fetch statt curl/wget (nicht garantiert vorhanden).
      # ok=false (Bibliothek nicht geladen) gilt als unhealthy.
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://127.0.0.1:8085/healthz').then((r)=>r.json()).then((j)=>process.exit(j.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 20s

volumes:
  n8n_data:
  risk_layer_katalog:
  risk_layer_corpus:
  eric_logs:
